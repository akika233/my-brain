<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dutch B1 · Contact! 2 Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#1a2332;--muted:#5a6678;--paper:#f7f3eb;--card:#fffdf8;--line:#e2d9cb;
  --accent:#c45c26;--sea:#2f6f6a;--warn:#b8860b;--ok:#2d6a4f;--red:#c0392b;
  --sea-soft:#e4f0ee;--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Manrope",system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:"Fraunces",serif;font-weight:700;letter-spacing:-.02em;line-height:1.2}
a{color:var(--accent)}

/* ── topbar ── */
.topbar{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;padding:.6rem 1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.topbar h1{font-size:1.1rem;color:#fff;white-space:nowrap}
.ch-tabs{display:flex;gap:.3rem;flex-wrap:wrap;flex:1}
.ch-tab{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:.28rem .75rem;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.ch-tab:hover{background:rgba(255,255,255,.2)}
.ch-tab.active{background:var(--accent);border-color:var(--accent)}

/* ── module nav ── */
.mod-nav{display:flex;gap:.5rem;flex-wrap:wrap;padding:.75rem 1rem;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:49px;z-index:30}
.mod-btn{display:flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:transparent;border-radius:999px;padding:.38rem .9rem;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--muted);transition:.15s}
.mod-btn:hover{border-color:var(--sea);color:var(--sea)}
.mod-btn.active{background:var(--sea);border-color:var(--sea);color:#fff}
.mod-icon{font-size:.95rem}

/* ── layout ── */
.wrap{max-width:860px;margin:0 auto;padding:1.2rem 1rem 3rem}
.panel{display:none}.panel.active{display:block}

/* ── chapter header ── */
.ch-header{padding:1.2rem 0 .75rem}
.ch-eyebrow{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:.3rem}
.ch-header h2{font-size:1.7rem;margin-bottom:.35rem}
.ch-focus{color:var(--muted);font-size:.92rem}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;margin-bottom:.85rem;box-shadow:0 4px 16px rgba(26,35,50,.05)}
.card-sm{padding:.75rem .95rem}

/* ── buttons ── */
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.42rem 1rem;font-size:.85rem;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--ink)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#a04b1e}
.btn-sea{background:var(--sea);border-color:var(--sea);color:#fff}
.btn-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.65rem}
.btn-sm{padding:.3rem .7rem;font-size:.78rem}
.btn-icon{padding:.38rem .6rem;font-size:1rem;line-height:1;border-radius:10px}

/* ── VOCAB ── */
.vocab-controls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
.vocab-progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:.85rem}
.vocab-progress-fill{height:100%;background:var(--sea);transition:width .4s}
.vocab-stat{font-size:.8rem;color:var(--muted);margin-bottom:.5rem}
.flashcard{perspective:900px;cursor:pointer;user-select:none}
.flashcard-inner{position:relative;width:100%;min-height:220px;transition:transform .45s;transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;width:100%;min-height:220px;backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.8rem;text-align:center;background:var(--card)}
.fc-back{transform:rotateY(180deg);background:#f4f7fb}
.fc-nl{font-family:"Fraunces",serif;font-size:1.9rem;margin-bottom:.45rem}
.fc-cat{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.9rem}
.fc-hint{font-size:.82rem;color:var(--muted);font-style:italic}
.fc-en{font-size:1.3rem;font-weight:700;margin-bottom:.55rem}
.fc-ex{font-size:.92rem;color:var(--ink);font-style:italic;margin-bottom:.3rem}
.fc-ex-en{font-size:.88rem;color:var(--muted)}
.vocab-nav{display:flex;justify-content:space-between;align-items:center;margin-top:.85rem}

/* ── GRAMMAR ── */
.rule-card{margin-bottom:1.2rem}
.rule-title{font-size:1.05rem;font-weight:700;margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.rule-badge{background:#ffe8d6;color:var(--accent);font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;text-transform:uppercase}
.pattern-box{background:#1a2332;color:#f7f3eb;border-radius:10px;padding:.65rem 1rem;font-family:monospace;font-size:.9rem;margin:.55rem 0}
.ex-table{width:100%;border-collapse:collapse;margin:.5rem 0}
.ex-table td{padding:.4rem .6rem;border:1px solid var(--line);font-size:.92rem}
.ex-table td:first-child{font-weight:600;background:#f8f5f0;width:52%}
.ex-table td em{color:var(--accent)}
/* exercises */
.exercise{border-left:3px solid var(--sea);padding:.65rem .85rem;margin-bottom:.7rem;background:#f8fdfc}
.exercise h4{font-size:.9rem;font-weight:700;margin-bottom:.5rem}
.ex-item{margin-bottom:.55rem}
.ex-item .stem{font-size:.93rem;margin-bottom:.3rem}
.option-btn{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:.3rem .7rem;margin:.2rem;font-size:.85rem;cursor:pointer;transition:.15s}
.option-btn:hover:not(:disabled){border-color:var(--sea);color:var(--sea)}
.option-btn.correct{background:#e8f8ef;border-color:var(--ok);color:var(--ok);font-weight:700}
.option-btn.wrong{background:#fde8e8;border-color:var(--red);color:var(--red)}
.fillblank-input{border:1px solid var(--line);border-radius:8px;padding:.3rem .6rem;width:120px;margin:0 .3rem}

/* ── READING / LISTENING ── */
.text-body{font-size:1.02rem;line-height:1.75;color:var(--ink)}
.text-para{margin-bottom:1rem}
.text-en-para{font-size:.9rem;color:var(--muted);font-style:italic;margin-bottom:.9rem;border-left:3px solid var(--line);padding-left:.6rem}
.qcard{background:#f8f5f0;border-radius:12px;padding:.85rem 1rem;margin-bottom:.6rem}
.qcard strong{font-size:.9rem;display:block;margin-bottom:.35rem}
.qcard .answer{font-size:.88rem;color:var(--sea);display:none}
.qcard.revealed .answer{display:block}
.listen-controls{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.speed-btn{padding:.28rem .65rem;font-size:.78rem;border-radius:8px}
.sent-row{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem 0;border-bottom:1px dashed var(--line)}
.sent-row:last-child{border:0}
.sent-nl{flex:1;font-size:.97rem}
.sent-en{font-size:.88rem;color:var(--muted);flex:1;font-style:italic}
.hidden-text{filter:blur(4px);pointer-events:none;user-select:none}

/* ── SPEAKING ── */
.speak-prompt-box{border-left:4px solid var(--accent);padding:.8rem 1rem;background:#fff9f5;border-radius:0 12px 12px 0;margin-bottom:.9rem;font-size:1.02rem}
.speak-prompt-en{color:var(--muted);font-size:.9rem;margin-top:.3rem;font-style:italic}
.useful-phrases{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.phrase-chip{background:var(--sea-soft);color:var(--sea);border:1px solid #c8e0de;border-radius:999px;padding:.2rem .65rem;font-size:.8rem;cursor:pointer}
.phrase-chip:hover{background:#c8e0de}
.sample-answer{border-top:1px dashed var(--line);padding-top:.85rem;margin-top:.85rem}
.sample-nl{font-size:.97rem;line-height:1.75;white-space:pre-wrap;margin:.4rem 0}
.sample-en{font-size:.88rem;color:var(--muted);font-style:italic;white-space:pre-wrap}
.rec-btn{display:flex;align-items:center;gap:.45rem;padding:.55rem 1.1rem;border-radius:999px;font-size:.9rem;font-weight:700;border:2px solid var(--accent);background:#fff;cursor:pointer;transition:.15s}
.rec-btn.listening{background:var(--accent);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,92,38,.3)}50%{box-shadow:0 0 0 8px rgba(196,92,38,0)}}
.rec-result{margin-top:.65rem;padding:.65rem .9rem;background:#f4f7fb;border-radius:12px;font-size:.93rem;min-height:3rem}
.rec-audio{display:none;width:100%;margin-top:.55rem}
.rec-audio.show{display:block}
.btn.listening,.rec-btn.listening{background:var(--accent);color:#fff;border-color:var(--accent);animation:pulse 1.2s infinite}

/* ── WRITING ── */
.writing-prompt{font-size:1.05rem;line-height:1.65;margin-bottom:.85rem}
.writing-area{width:100%;min-height:180px;border:1px solid var(--line);border-radius:12px;padding:.85rem;resize:vertical;background:#fff;font-size:.97rem;line-height:1.7}
.writing-area:focus{outline:none;border-color:var(--sea)}
.word-count{font-size:.8rem;color:var(--muted);text-align:right;margin:.3rem 0 .6rem}
.word-count.ok{color:var(--ok);font-weight:700}
.writing-tip{font-size:.88rem;background:#fffbf0;border:1px solid #f0e6c0;border-radius:10px;padding:.6rem .85rem;margin-bottom:.65rem;color:#6b5000}
.saved-indicator{font-size:.8rem;color:var(--ok);margin-left:.5rem;opacity:0;transition:.3s}
.saved-indicator.show{opacity:1}

/* ── progress dots ── */
.prog-row{display:flex;gap:.3rem;flex-wrap:wrap;margin:.35rem 0}
.prog-dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.prog-dot.known{background:var(--sea)}
.prog-dot.active{background:var(--accent)}

/* ── WRITING REVIEW ── */
.review-box{margin-top:1rem;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.review-header{padding:.75rem 1rem;font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.review-header.good{background:#f0f7f3;color:var(--ok);}
.review-header.ok{background:#fffbf0;color:#7a5b00;}
.review-header.needs{background:#fff5f5;color:#a33;}
.review-section{padding:.75rem 1rem;border-top:1px solid var(--line);}
.review-section h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:0 0 .5rem;}
.review-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.55rem;}
.review-list li{font-size:.9rem;line-height:1.5;padding-left:1.3rem;position:relative;}
.review-list li::before{position:absolute;left:0;top:.05rem;font-weight:700;}
.review-pos li::before{content:"✓";color:var(--ok);}
.review-imp li::before{content:"→";color:var(--accent-deep);}
.review-orig{font-size:.83rem;color:var(--muted);margin-top:.2rem;}
.review-fix{font-size:.85rem;color:var(--sea);background:var(--sea-soft);border-radius:6px;padding:.18rem .5rem;display:inline;}
.review-corrected{background:#f8f7f2;border-radius:10px;padding:.8rem .95rem;font-size:.92rem;line-height:1.75;white-space:pre-wrap;margin-top:.35rem;}
.gem-key-row{display:flex;gap:.4rem;align-items:center;margin-top:.45rem;flex-wrap:wrap;}
.gem-key-row input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);border-radius:8px;padding:.4rem .65rem;font-size:.85rem;background:#fff;}
.review-loading{color:var(--muted);font-size:.9rem;padding:.6rem 0;display:flex;align-items:center;gap:.5rem;}

/* ── responsive ── */
@media(max-width:600px){
  .topbar{padding:.5rem .7rem;gap:.5rem}
  .ch-tabs{gap:.2rem}
  .ch-tab{padding:.22rem .55rem;font-size:.72rem}
  .fc-nl{font-size:1.5rem}
  .wrap{padding:.85rem .7rem 2.5rem}
}
</style>
</head>
<body>

<!-- ── top nav ── -->
<div class="topbar">
  <h1>Dutch B1</h1>
  <div class="ch-tabs" id="chTabs"></div>
</div>

<!-- ── module nav ── -->
<div class="mod-nav" id="modNav">
  <button class="mod-btn active" data-mod="vocab">  <span class="mod-icon">🃏</span> Vocab</button>
  <button class="mod-btn" data-mod="grammar"><span class="mod-icon">📐</span> Grammar</button>
  <button class="mod-btn" data-mod="reading"><span class="mod-icon">📖</span> Reading</button>
  <button class="mod-btn" data-mod="listening"><span class="mod-icon">🎧</span> Listening</button>
  <button class="mod-btn" data-mod="speaking"><span class="mod-icon">🎤</span> Speaking</button>
  <button class="mod-btn" data-mod="writing"><span class="mod-icon">✍️</span> Writing</button>
</div>

<div class="wrap">
  <!-- chapter heading -->
  <div class="ch-header">
    <div class="ch-eyebrow" id="chEyebrow"></div>
    <h2 id="chTitle"></h2>
    <div class="ch-focus" id="chFocus"></div>
  </div>

  <!-- ── VOCAB panel ── -->
  <div class="panel active" id="panel-vocab">
    <div class="vocab-controls">
      <button class="btn btn-sm" id="vcShuffle">🔀 Shuffle</button>
      <button class="btn btn-sm" id="vcUnknown">⭐ Unknown only</button>
      <button class="btn btn-sm" id="vcAll">All</button>
      <button class="btn btn-sm" id="vcReset">Reset known</button>
    </div>
    <div class="vocab-stat"><span id="vcKnownCount">0</span> / <span id="vcTotal">0</span> known &nbsp;·&nbsp; card <span id="vcPos">1</span></div>
    <div class="prog-row" id="progDots"></div>
    <div class="vocab-progress"><div class="vocab-progress-fill" id="vcFill"></div></div>
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="flashcard-inner" id="fcInner">
        <div class="fc-face fc-front">
          <div class="fc-cat" id="fcCat"></div>
          <div class="fc-nl" id="fcNl"></div>
          <div class="fc-hint">tap to reveal</div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-en" id="fcEn"></div>
          <div class="fc-ex" id="fcEx"></div>
          <div class="fc-ex-en" id="fcExEn"></div>
        </div>
      </div>
    </div>
    <div class="vocab-nav">
      <button class="btn" onclick="vcNav(-1)">← Prev</button>
      <div class="btn-row" style="gap:.4rem">
        <button class="btn btn-sm btn-icon" id="speakWordBtn" onclick="speakCurrentWord()" title="Hear pronunciation">🔊</button>
        <button class="btn btn-sm btn-icon" onclick="speakExample()" title="Hear example sentence">▶ Example</button>
        <button class="btn btn-sm" style="background:#e8f8ef;border-color:#2d6a4f;color:#2d6a4f" onclick="markKnown()">✓ Known</button>
        <button class="btn btn-sm" style="background:#fde8e8;border-color:#c0392b;color:#c0392b" onclick="markUnknown()">✗ Again</button>
      </div>
      <button class="btn" onclick="vcNav(1)">Next →</button>
    </div>
  </div>

  <!-- ── GRAMMAR panel ── -->
  <div class="panel" id="panel-grammar">
    <div id="grammarContent"></div>
  </div>

  <!-- ── READING panel ── -->
  <div class="panel" id="panel-reading">
    <div id="readingContent"></div>
  </div>

  <!-- ── LISTENING panel ── -->
  <div class="panel" id="panel-listening">
    <div id="listeningContent"></div>
  </div>

  <!-- ── SPEAKING panel ── -->
  <div class="panel" id="panel-speaking">
    <div id="speakingContent"></div>
  </div>

  <!-- ── WRITING panel ── -->
  <div class="panel" id="panel-writing">
    <div id="writingContent"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// CONTENT DATA — all 8 Contact! 2 chapters
// ════════════════════════════════════════════════════════════════════
const CHAPTERS = [
{
  id:1, title:"Gisteren, vandaag, morgen",
  focus:"Plannen · ambities · bijzinnen · indirecte rede",
  vocab:[
    {nl:"de ambitie",en:"ambition",ex:"Ik heb de ambitie om arts te worden.",exEn:"I have the ambition to become a doctor."},
    {nl:"het plan",en:"plan / intention",ex:"Wat zijn jouw plannen voor de toekomst?",exEn:"What are your plans for the future?"},
    {nl:"de toekomst",en:"future",ex:"De toekomst is onzeker, maar ik ben optimistisch.",exEn:"The future is uncertain, but I'm optimistic."},
    {nl:"het verleden",en:"past",ex:"In het verleden werkte hij als kok.",exEn:"In the past he worked as a cook."},
    {nl:"het doel",en:"goal / aim",ex:"Mijn doel is om vloeiend Nederlands te spreken.",exEn:"My goal is to speak Dutch fluently."},
    {nl:"de carrière",en:"career",ex:"Ze wil een carrière in de geneeskunde.",exEn:"She wants a career in medicine."},
    {nl:"de opleiding",en:"education / training",ex:"Hij volgt een opleiding tot leraar.",exEn:"He is doing teacher training."},
    {nl:"de ervaring",en:"experience",ex:"Heb je werkervaring in de zorg?",exEn:"Do you have work experience in healthcare?"},
    {nl:"verwachten",en:"to expect",ex:"Ik verwacht dat het moeilijk wordt.",exEn:"I expect it to be difficult."},
    {nl:"hopen",en:"to hope",ex:"We hopen dat je snel beter wordt.",exEn:"We hope you get better soon."},
    {nl:"van plan zijn",en:"to intend / to plan",ex:"Ik ben van plan om te gaan studeren.",exEn:"I plan to study."},
    {nl:"slagen (voor)",en:"to pass (an exam)",ex:"Hij is geslaagd voor zijn rijexamen.",exEn:"He passed his driving test."},
    {nl:"bereiken",en:"to achieve / to reach",ex:"Ze heeft haar doel bereikt.",exEn:"She achieved her goal."},
    {nl:"bijdragen aan",en:"to contribute to",ex:"Iedereen kan bijdragen aan een betere samenleving.",exEn:"Everyone can contribute to a better society."},
    {nl:"veranderen",en:"to change",ex:"Veel dingen zijn veranderd in tien jaar.",exEn:"A lot has changed in ten years."},
    {nl:"verbeteren",en:"to improve",ex:"Ik wil mijn Nederlands verbeteren.",exEn:"I want to improve my Dutch."},
    {nl:"geloven (dat)",en:"to believe (that)",ex:"Ik geloof dat ik het kan.",exEn:"I believe that I can do it."},
    {nl:"dromen van",en:"to dream of",ex:"Ze droomt van een huis in de bergen.",exEn:"She dreams of a house in the mountains."},
    {nl:"overtuigd zijn",en:"to be convinced",ex:"Ik ben ervan overtuigd dat dit lukt.",exEn:"I am convinced this will succeed."},
    {nl:"vooruitkomen",en:"to get ahead / progress",ex:"Door hard werken kom je vooruit.",exEn:"By working hard, you get ahead."},
  ],
  grammar:{
    points:[
      {
        title:"Bijzinnen — werkwoord achteraan",
        badge:"Bijzin",
        explanation:"In een bijzin staat het werkwoord altijd aan het <em>eind</em>. Veelgebruikte voegwoorden: <strong>dat, omdat, terwijl, als, toen, zodat, hoewel, wanneer, voordat, nadat</strong>.",
        pattern:"HOOFDZIN + VOEGWOORD + onderwerp … + WERKWOORD",
        examples:[
          {nl:"Ik weet <em>dat hij morgen komt</em>.", en:"I know <em>that he is coming tomorrow</em>."},
          {nl:"Ze werkt hard <em>omdat ze wil slagen</em>.", en:"She works hard <em>because she wants to succeed</em>."},
          {nl:"Hij luistert muziek <em>terwijl hij kookt</em>.", en:"He listens to music <em>while he cooks</em>."},
          {nl:"<em>Als je hard werkt</em>, kom je verder.", en:"<em>If you work hard</em>, you will get further."},
        ]
      },
      {
        title:"Indirecte rede",
        badge:"Rapporteren",
        explanation:"Gebruik <strong>dat</strong> + bijzin om te rapporteren wat iemand zei. Tijden verschuiven (presens → verleden).",
        pattern:"Hij zegt/zei DAT + onderwerp … + WERKWOORD (achteraan)",
        examples:[
          {nl:"Direct: \"Ik ga morgen naar Utrecht.\"", en:"Direct: \"I'm going to Utrecht tomorrow.\""},
          {nl:"Indirect: Hij <em>zegt dat</em> hij morgen naar Utrecht <em>gaat</em>.", en:"Indirect: He <em>says that</em> he is going to Utrecht tomorrow."},
          {nl:"Ze <em>vertelde dat</em> ze haar diploma <em>had gehaald</em>.", en:"She <em>told us that</em> she had obtained her diploma."},
        ]
      }
    ],
    exercises:[
      {
        id:"h1ex1",
        instruction:"Kies het juiste voegwoord.",
        items:[
          {stem:"Ik weet ___ hij morgen terugkomt.",options:["dat","omdat","terwijl"],answer:0},
          {stem:"Ze studeert hard ___ ze wil slagen.",options:["dat","omdat","toen"],answer:1},
          {stem:"___ het regent, blijven we binnen.",options:["Omdat","Als","Dat"],answer:1},
          {stem:"Hij luistert naar muziek ___ hij werkt.",options:["als","dat","terwijl"],answer:2},
        ]
      }
    ]
  },
  reading:{
    title:"Mijn toekomstplannen",

function getKnown(chId){
  if(!knownSets[chId]){
    const stored = localStorage.getItem("known_"+chId);
    knownSets[chId] = stored ? new Set(JSON.parse(stored)) : new Set();
  }
  return knownSets[chId];
}
function saveKnown(chId){ localStorage.setItem("known_"+chId, JSON.stringify([...getKnown(chId)])); }

    || voices.find(v=>/^nl-NL/i.test(v.lang))
    || voices.find(v=>/^nl/i.test(v.lang))
    || null;
}
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function refreshTtsButtons(){
  document.querySelectorAll("[data-tts-toggle]").forEach(btn=>{
    if(tts.paused) btn.textContent = "▶ Continue";
    else if(tts.active || (window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending))) btn.textContent = "⏸ Pause";
    else btn.textContent = "■ Stop";
  });
}

function speakQueue(texts, rate=1.0){
  if(!window.speechSynthesis){ alert("Speech synthesis not available in this browser."); return; }
  tts.hardStop = true;
  speechSynthesis.cancel();
  tts.hardStop = false;
  tts.queue = (Array.isArray(texts) ? texts : [texts]).map(t=>String(t||"").trim()).filter(Boolean);
  tts.idx = 0;
  tts.rate = rate;
  tts.paused = false;
  tts.active = tts.queue.length > 0;
  refreshTtsButtons();
  playNextUtterance();
}

function speak(text, rate=1.0){ speakQueue([text], rate); }

function playNextUtterance(){
  if(!window.speechSynthesis || tts.hardStop || tts.paused) return;
  if(tts.idx >= tts.queue.length){
    tts.active = false;
    refreshTtsButtons();
    return;
  }
  const u = new SpeechSynthesisUtterance(tts.queue[tts.idx]);
  u.lang = "nl-NL";
  u.rate = tts.rate;
  if(dutchVoice) u.voice = dutchVoice;
  u.onend = ()=>{
    if(tts.hardStop || tts.paused) return;
    tts.idx++;
    setTimeout(playNextUtterance, 350);
  };
  u.onerror = ()=>{
    if(tts.hardStop) return;
    tts.idx++;
    setTimeout(playNextUtterance, 200);
  };
  speechSynthesis.speak(u);
  tts.active = true;
  refreshTtsButtons();
}

/** Pause while playing, or continue from pause. */
function togglePauseContinue(){
  if(!window.speechSynthesis) return;
  if(tts.paused || speechSynthesis.paused){
    tts.paused = false;
    if(speechSynthesis.paused) speechSynthesis.resume();
    else if(tts.active && tts.idx < tts.queue.length && !speechSynthesis.speaking) playNextUtterance();
    refreshTtsButtons();
    return;
  }
  if(speechSynthesis.speaking || speechSynthesis.pending || tts.active){
    try{ speechSynthesis.pause(); }catch(e){}
    tts.paused = true;
    refreshTtsButtons();
  }
}

function stopTTS(){
  if(!window.speechSynthesis) return;
  tts.hardStop = true;
  tts.paused = false;
  tts.active = false;
  tts.queue = [];
  tts.idx = 0;
  speechSynthesis.cancel();
  tts.hardStop = false;
  refreshTtsButtons();
}

// VOCAB
// ════════════════════════════════════════════════════════════════════
function resetVocabDeck(){
  const ch=currentChapter();
  vcDeck=[...ch.vocab.map((v,i)=>({...v,origIdx:i}))];
  vcPos=0; vcFlipped=false; vcShowUnknown=false;
  if(currentMod==="vocab") updateVocabUI();
}

function shuffleDeck(){
  for(let i=vcDeck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vcDeck[i],vcDeck[j]]=[vcDeck[j],vcDeck[i]];}
  vcPos=0; vcFlipped=false; updateVocabUI();
}

function filterUnknown(){
  const ch=currentChapter();
  const known=getKnown(ch.id);
  vcShowUnknown=true;
  vcDeck=ch.vocab.map((v,i)=>({...v,origIdx:i})).filter(v=>!known.has(v.nl));
  if(!vcDeck.length){ vcDeck=[...ch.vocab.map((v,i)=>({...v,origIdx:i}))]; alert("All words are marked as known! Great job!"); }
  vcPos=0; vcFlipped=false; updateVocabUI();
}

function updateVocabUI(){
  const ch=currentChapter();
  const known=getKnown(ch.id);
  if(!vcDeck.length || vcDeck[0].origIdx===undefined) resetVocabDeck();

  const total=vcDeck.length;
  const knownCount=vcDeck.filter(v=>known.has(v.nl)).length;

  document.getElementById("vcTotal").textContent=total;
  document.getElementById("vcKnownCount").textContent=knownCount;
  document.getElementById("vcPos").textContent=vcPos+1;
  document.getElementById("vcFill").style.width=(knownCount/total*100)+"%";

  // progress dots
  const dots=document.getElementById("progDots");
  dots.innerHTML="";
  vcDeck.forEach((v,i)=>{
    const d=document.createElement("span");
    d.className="prog-dot"+(i===vcPos?" active":known.has(v.nl)?" known":"");
    dots.appendChild(d);
  });

  const v=vcDeck[vcPos]||vcDeck[0];
  document.getElementById("fcNl").textContent=v.nl;
  document.getElementById("fcEn").textContent=v.en;
  document.getElementById("fcEx").textContent=v.ex;
  document.getElementById("fcExEn").textContent=v.exEn;
  const cat=v.nl.startsWith("de ")||v.nl.startsWith("het ")?"noun":v.nl.includes(" ")&&!v.nl.startsWith("de ")&&!v.nl.startsWith("het ")?"phrase":"verb/adj";
  document.getElementById("fcCat").textContent=cat;

  const fc=document.getElementById("flashcard");
  if(vcFlipped) fc.classList.add("flipped");
  else fc.classList.remove("flipped");
}

function flipCard(){ vcFlipped=!vcFlipped; updateVocabUI(); }

function vcNav(dir){
  vcFlipped=false;
  vcPos=(vcPos+dir+vcDeck.length)%vcDeck.length;
  updateVocabUI();
}

function markKnown(){
  const ch=currentChapter();
  const v=vcDeck[vcPos];
  if(v){ getKnown(ch.id).add(v.nl); saveKnown(ch.id); }
  vcFlipped=false;
  vcPos=Math.min(vcPos+1,vcDeck.length-1);
  updateVocabUI();
}

function markUnknown(){
  const ch=currentChapter();
  const v=vcDeck[vcPos];
  if(v){ getKnown(ch.id).delete(v.nl); saveKnown(ch.id); }
  vcFlipped=false;
  vcPos=Math.min(vcPos+1,vcDeck.length-1);
  updateVocabUI();
}

function speakCurrentWord(){
  const v=vcDeck[vcPos];
  if(v) speak(v.nl, 0.85);
}
function speakExample(){
  const v=vcDeck[vcPos];
  if(v) speak(v.ex, 0.9);
}

document.getElementById("vcShuffle").onclick=shuffleDeck;
document.getElementById("vcUnknown").onclick=filterUnknown;
document.getElementById("vcAll").onclick=resetVocabDeck;
document.getElementById("vcReset").onclick=()=>{
  const ch=currentChapter();
  getKnown(ch.id).clear(); saveKnown(ch.id); updateVocabUI();
};

function renderGrammar(){
  const ch=currentChapter();
  const {points,exercises}=ch.grammar;
  let html="";
  points.forEach(p=>{
    html+=`<div class="card rule-card">
      <div class="rule-title"><span class="rule-badge">${p.badge}</span> ${p.title}</div>
      <p style="font-size:.93rem;margin-bottom:.5rem">${p.explanation}</p>`;
    if(p.pattern) html+=`<div class="pattern-box">${p.pattern.replace(/\n/g,"<br/>")}</div>`;
    html+=`<table class="ex-table">`;
    p.examples.forEach(ex=>{
      html+=`<tr>
        <td onclick="speak(this.textContent.replace(/<[^>]+>/g,'').replace(/^[^:]+: /,''),0.9)" style="cursor:pointer" title="Click to hear">🔊 ${ex.nl}</td>
        <td>${ex.en}</td>
      </tr>`;
    });
    html+=`</table></div>`;
  });

  exercises.forEach(ex=>{
    html+=`<div class="exercise" id="ex_${ex.id}">
      <h4>${ex.instruction}</h4>`;
    ex.items.forEach((item,idx)=>{
      html+=`<div class="ex-item">
        <div class="stem">${idx+1}. ${item.stem}</div>
        <div>`;
      item.options.forEach((opt,oi)=>{
        html+=`<button class="option-btn" data-exid="${ex.id}" data-idx="${idx}" data-opt="${oi}" data-correct="${oi===item.answer}" onclick="checkOpt(this)">${opt}</button>`;
      });
      html+=`</div></div>`;
    });
    html+=`</div>`;
  });

  document.getElementById("grammarContent").innerHTML=html;
}

function checkOpt(btn){
  const exid=btn.dataset.exid;
  const idx=btn.dataset.idx;
  // disable all options for this item
  document.querySelectorAll(`[data-exid="${exid}"][data-idx="${idx}"]`).forEach(b=>{
    b.disabled=true;
    if(b.dataset.correct==="true") b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
  });
}

function renderSpeaking(){
  const ch=currentChapter();
  const sp=ch.speaking;
  let html="";
  sp.prompts.forEach((p,idx)=>{
    const pid="sp_"+idx;
    html+=`<div class="card">
      <div style="display:flex;gap:.5rem;align-items:center;margin-bottom:.55rem;flex-wrap:wrap">
        <span class="rule-badge">${p.type}</span>
        <strong style="font-family:Fraunces,serif;font-size:1.05rem">${p.title}</strong>
      </div>
      <div class="speak-prompt-box">
        ${p.prompt}
        <div class="speak-prompt-en">${p.promptEn}</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-sm" onclick="speak(${JSON.stringify(p.prompt)},0.88)">▶ Start audio</button>
        <button class="btn btn-sm" data-tts-toggle onclick="togglePauseContinue()">■ Stop</button>
        <button class="btn btn-sm btn-sea" id="recBtn_${idx}" onclick="toggleRec(${idx})">🎤 Record myself</button>
        <button class="btn btn-sm" id="playRecBtn_${idx}" onclick="playRecording(${idx})" disabled>▶ Listen recording</button>
      </div>
      <div class="rec-result" id="recResult_${idx}">Press 🎤 to record, then ▶ Listen recording to hear yourself.</div>
      <audio id="recAudio_${idx}" class="rec-audio" controls></audio>
      <div style="margin:.6rem 0 .4rem;font-size:.85rem;font-weight:700;color:var(--muted)">Useful phrases — click to hear:</div>
      <div class="useful-phrases">`;
    p.phrases.forEach(ph=>{
      html+=`<span class="phrase-chip" onclick="speak(${JSON.stringify(ph)},0.88)">${ph}</span>`;
    });
    html+=`</div>
      <div class="sample-answer">
        <button class="btn btn-sm" onclick="toggleSample('${pid}')">Show sample answer</button>
        <button class="btn btn-sm" onclick="speak(${JSON.stringify(p.sampleNl)},0.9)">▶ Read sample</button>
        <div id="${pid}_sample" style="display:none;margin-top:.7rem">
          <div class="sample-nl">${p.sampleNl}</div>
          <div class="sample-en">${p.sampleEn}</div>
        </div>
      </div>
    </div>`;
  });
  document.getElementById("speakingContent").innerHTML=html;

  window.toggleSample=function(id){
    const el=document.getElementById(id+"_sample");
    el.style.display=el.style.display==="none"?"block":"none";
  };

  window.toggleRec=async function(idx){
    const btn=document.getElementById("recBtn_"+idx);
    const result=document.getElementById("recResult_"+idx);
    const playBtn=document.getElementById("playRecBtn_"+idx);
    const audioEl=document.getElementById("recAudio_"+idx);
    const st=recState[idx];

    if(st && st.recorder && st.recorder.state==="recording"){
      st.recorder.stop();
      if(st.recog){ try{ st.recog.stop(); }catch(e){} }
      btn.classList.remove("listening");
      btn.textContent="🎤 Record myself";
      return;
    }

    // stop any other active recording
    Object.keys(recState).forEach(k=>{
      const other=recState[k];
      if(other && other.recorder && other.recorder.state==="recording"){
        try{ other.recorder.stop(); }catch(e){}
        if(other.recog){ try{ other.recog.stop(); }catch(e){} }
      }
      const ob=document.getElementById("recBtn_"+k);
      if(ob){ ob.classList.remove("listening"); ob.textContent="🎤 Record myself"; }
    });

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      result.textContent="Recording needs a modern browser (Chrome/Edge) over http://localhost or https.";
      return;
    }

    try{
      stopTTS();
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const chunks=[];
      const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
        : (MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "");
      const recorder = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
      recState[idx]={ recorder, chunks, stream, url: st?.url || null, recog:null };

      recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop=()=>{
        stream.getTracks().forEach(t=>t.stop());
        if(chunks.length){
          if(recState[idx].url) URL.revokeObjectURL(recState[idx].url);
          const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
          const url=URL.createObjectURL(blob);
          recState[idx].url=url;
          audioEl.src=url;
          audioEl.classList.add("show");
          playBtn.disabled=false;
          const transcript=result.dataset.transcript||"";
          result.textContent = transcript
            ? ("Saved. Transcript: "+transcript+" — press ▶ Listen recording")
            : "Recording saved — press ▶ Listen recording to hear yourself.";
        } else {
          result.textContent="No audio captured. Try again and allow the microphone.";
        }
        btn.classList.remove("listening");
        btn.textContent="🎤 Record myself";
      };

      recorder.start();
      btn.classList.add("listening");
      btn.textContent="⏹ Stop recording";
      result.dataset.transcript="";
      result.textContent="🎙 Recording… speak Dutch now";

      // Optional live transcript (Chrome)
      const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(SpeechRecognition){
        const recog=new SpeechRecognition();
        recog.lang="nl-NL";
        recog.continuous=true;
        recog.interimResults=true;
        recog.onresult=e=>{
          let txt="";
          for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript+" ";
          txt=txt.trim();
          result.dataset.transcript=txt;
          result.textContent="🎙 "+txt;
        };
        try{ recog.start(); recState[idx].recog=recog; }catch(e){}
      }
    }catch(err){
      result.textContent="Microphone blocked. Allow mic access, or open via http://localhost (not a raw file:// page).";
    }
  };

  window.playRecording=function(idx){
    const audioEl=document.getElementById("recAudio_"+idx);
    const result=document.getElementById("recResult_"+idx);
    const playBtn=document.getElementById("playRecBtn_"+idx);
    if(!audioEl || !audioEl.src){
      result.textContent="No recording yet — press 🎤 Record myself first.";
      return;
    }
    stopTTS();
    if(!audioEl.paused && !audioEl.ended){
      audioEl.pause();
      playBtn.textContent="▶ Listen recording";
      return;
    }
    audioEl.currentTime=0;
    audioEl.play().then(()=>{
      playBtn.textContent="⏸ Pause recording";
    }).catch(()=>{
      result.textContent="Could not play recording. Try recording again.";
    });
    audioEl.onended=()=>{ playBtn.textContent="▶ Listen recording"; };
  };
}

      <button class="btn" data-tts-toggle onclick="togglePauseContinue()">■ Stop</button>
      <button class="btn" onclick="if(confirm('Wis je tekst?')){document.getElementById('writeArea').value='';updateWordCount('${storageKey}','${w.minWords}')}">Wissen</button>
      <span class="saved-indicator" id="savedInd">Opgeslagen ✓</span>
    </div>
    <div style="margin-top:.85rem;padding-top:.85rem;border-top:1px dashed var(--line);">
      <button class="btn btn-primary" id="reviewBtn" onclick="reviewWriting()">✨ AI Review</button>
      <span style="font-size:.82rem;color:var(--muted);margin-left:.5rem;">Gemini reads your text and gives B1 feedback.</span>
    </div>
    <details id="gemKeyDetails" style="margin-top:.55rem;">
      <summary style="font-size:.8rem;color:var(--muted);cursor:pointer;user-select:none;">🔑 Gemini API key</summary>
      <div class="gem-key-row">
        <input type="password" id="gemKeyInput" placeholder="Paste GEMINI_API_KEY here" />
        <button class="btn btn-sm" onclick="
          localStorage.setItem('dutch-b1-gemini-key', document.getElementById('gemKeyInput').value.trim());
          this.textContent='Saved ✓';
          setTimeout(()=>this.textContent='Save',1600);
        ">Save</button>
      </div>
    </details>
    <div id="reviewResult"></div>
  </div>`;
  document.getElementById("writingContent").innerHTML=html;
  // pre-fill key if stored
  const storedKey=localStorage.getItem("dutch-b1-gemini-key")||"";
  if(storedKey){const ki=document.getElementById("gemKeyInput");if(ki)ki.value=storedKey;}
  updateWordCount(storageKey, w.minWords);

  window.updateWordCount=function(key, min){
    const txt=document.getElementById("writeArea").value;
    const wc=txt.trim()?txt.trim().split(/\s+/).length:0;
    const el=document.getElementById("wordCount");
    el.textContent=wc+" woorden (minimum: "+min+")";
    el.className="word-count"+(wc>=min?" ok":"");
    localStorage.setItem(key, txt);
  };
  window.saveWriting=function(key){
    const txt=document.getElementById("writeArea").value;
    localStorage.setItem(key, txt);
    const ind=document.getElementById("savedInd");
    ind.classList.add("show");
    setTimeout(()=>ind.classList.remove("show"),1800);
  };
}

// ════════════════════════════════════════════════════════════════════
// WRITING REVIEW (Gemini)
// ════════════════════════════════════════════════════════════════════
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

window.reviewWriting=async function(){
  const txt=(document.getElementById("writeArea").value||"").trim();
  if(!txt||txt.split(/\s+/).length<5){alert("Write a few sentences first.");return;}

  let key=localStorage.getItem("dutch-b1-gemini-key")||"";
  if(!key){
    const inp=document.getElementById("gemKeyInput");
    if(inp) key=inp.value.trim();
  }
  if(!key){
    document.getElementById("gemKeyDetails").open=true;
    document.getElementById("gemKeyInput").focus();
    alert("Enter your Gemini API key below, then try again.");
    return;
  }

  const ch=currentChapter();
  const btn=document.getElementById("reviewBtn");
  btn.disabled=true;btn.textContent="Reviewing…";
  const resultEl=document.getElementById("reviewResult");
  resultEl.innerHTML='<div class="review-loading"><span>⏳</span> Sending to Gemini…</div>';

  const prompt=`You are a Dutch B1 language teacher. Review this student's writing exercise.

Assignment: ${ch.writing.prompt}
Grammar focus: ${ch.writing.tip}

Student wrote:
"""
${txt}
"""

Give honest, constructive feedback for a B1 learner. Be specific — refer to actual phrases from their text.
Return ONLY valid JSON (no markdown fences):
{
  "score": "good|ok|needs work",
  "summary": "1-2 sentence overall verdict in English",
  "positives": ["specific thing done well (max 3)"],
  "improvements": [{"issue": "short label", "original": "their Dutch phrase", "fix": "corrected Dutch", "explanation": "1-sentence English explanation"}],
  "corrected": "polished B1 version of their full text in Dutch"
}
Rules: max 3 items each in positives and improvements; corrected must be real Dutch (not English); keep corrections close to the student's own style.`;

  const models=["gemini-2.0-flash","gemini-flash-lite-latest","gemini-3.1-flash-lite"];
  let data=null,lastErr=null;
  for(const model of models){
    try{
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[{parts:[{text:prompt}]}],
          generationConfig:{temperature:0.3,responseMimeType:"application/json"}
        })
      });
      if(!r.ok){lastErr=new Error(model+" HTTP "+r.status);continue;}
      const j=await r.json();
      let out=j.candidates[0].content.parts[0].text.trim();
      if(out.startsWith("```")) out=out.replace(/^```(?:json)?\s*/,"").replace(/\s*```$/,"");
      data=JSON.parse(out);
      break;
    }catch(e){lastErr=e;}
  }

  btn.disabled=false;btn.textContent="✨ AI Review";

  if(!data){
    resultEl.innerHTML=`<div style="color:#a33;font-size:.9rem;padding:.5rem 0;">Error: ${esc((lastErr&&lastErr.message)||"Gemini failed")}. Check your API key.</div>`;
    return;
  }

  const scoreClass=data.score==="good"?"good":data.score==="ok"?"ok":"needs";
  const scoreLabel=data.score==="good"?"✓ Looking good!":data.score==="ok"?"~ Getting there":"↑ Needs work";

  const positives=(data.positives||[]).map(p=>`<li>${esc(p)}</li>`).join("");
  const improvements=(data.improvements||[]).map(imp=>`<li>
    <strong>${esc(imp.issue||"")}</strong>
    ${imp.original?`<div class="review-orig">"${esc(imp.original)}" → <span class="review-fix">${esc(imp.fix||"")}</span></div>`:""}
    <div class="review-orig" style="color:var(--muted);">${esc(imp.explanation||"")}</div>
  </li>`).join("");

  const correctedKey=`write_${ch.id}`;
  const correctedBtn=data.corrected
    ?`<button class="btn btn-sm" style="margin-top:.55rem;" onclick="
        document.getElementById('writeArea').value=${JSON.stringify(data.corrected)};
        updateWordCount('${correctedKey}','${ch.writing.minWords}');
        this.textContent='Done ✓';
        setTimeout(()=>this.textContent='Use this version',1500);">Use this version</button>`
    :"";

  resultEl.innerHTML=`<div class="review-box">
    <div class="review-header ${scoreClass}">
      <span>${scoreLabel}</span>
      <span style="font-weight:400;font-size:.88rem;">${esc(data.summary||"")}</span>
    </div>
    ${positives?`<div class="review-section"><h4>What's working</h4><ul class="review-list review-pos">${positives}</ul></div>`:""}
    ${improvements?`<div class="review-section"><h4>To improve</h4><ul class="review-list review-imp">${improvements}</ul></div>`:""}
    ${data.corrected?`<div class="review-section">
      <h4>Polished B1 version</h4>
      <div class="review-corrected">${esc(data.corrected)}</div>
      ${correctedBtn}
    </div>`:""}
  </div>`;
};

// ════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════
buildChTabs();
setupModTabs();
buildHeader();
resetVocabDeck();
updateVocabUI();
</script>
