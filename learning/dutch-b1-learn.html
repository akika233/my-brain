<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dutch B1 · Contact! 2 Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#1a2332;--muted:#5a6678;--paper:#f7f3eb;--card:#fffdf8;--line:#e2d9cb;
  --accent:#c45c26;--sea:#2f6f6a;--warn:#b8860b;--ok:#2d6a4f;--red:#c0392b;
  --sea-soft:#e4f0ee;--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Manrope",system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:"Fraunces",serif;font-weight:700;letter-spacing:-.02em;line-height:1.2}
a{color:var(--accent)}

/* ── topbar ── */
.topbar{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;padding:.6rem 1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.topbar h1{font-size:1.1rem;color:#fff;white-space:nowrap}
.ch-tabs{display:flex;gap:.3rem;flex-wrap:wrap;flex:1}
.ch-tab{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:.28rem .75rem;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.ch-tab:hover{background:rgba(255,255,255,.2)}
.ch-tab.active{background:var(--accent);border-color:var(--accent)}

/* ── module nav ── */
.mod-nav{display:flex;gap:.5rem;flex-wrap:wrap;padding:.75rem 1rem;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:49px;z-index:30}
.mod-btn{display:flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:transparent;border-radius:999px;padding:.38rem .9rem;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--muted);transition:.15s}
.mod-btn:hover{border-color:var(--sea);color:var(--sea)}
.mod-btn.active{background:var(--sea);border-color:var(--sea);color:#fff}
.mod-icon{font-size:.95rem}

/* ── layout ── */
.wrap{max-width:860px;margin:0 auto;padding:1.2rem 1rem 3rem}
.panel{display:none}.panel.active{display:block}

/* ── chapter header ── */
.ch-header{padding:1.2rem 0 .75rem}
.ch-eyebrow{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:.3rem}
.ch-header h2{font-size:1.7rem;margin-bottom:.35rem}
.ch-focus{color:var(--muted);font-size:.92rem}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;margin-bottom:.85rem;box-shadow:0 4px 16px rgba(26,35,50,.05)}
.card-sm{padding:.75rem .95rem}

/* ── buttons ── */
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.42rem 1rem;font-size:.85rem;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--ink)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#a04b1e}
.btn-sea{background:var(--sea);border-color:var(--sea);color:#fff}
.btn-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.65rem}
.btn-sm{padding:.3rem .7rem;font-size:.78rem}
.btn-icon{padding:.38rem .6rem;font-size:1rem;line-height:1;border-radius:10px}

/* ── VOCAB ── */
.vocab-controls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
.vocab-progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:.85rem}
.vocab-progress-fill{height:100%;background:var(--sea);transition:width .4s}
.vocab-stat{font-size:.8rem;color:var(--muted);margin-bottom:.5rem}
.flashcard{perspective:900px;cursor:pointer;user-select:none}
.flashcard-inner{position:relative;width:100%;min-height:220px;transition:transform .45s;transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;width:100%;min-height:220px;backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.8rem;text-align:center;background:var(--card)}
.fc-back{transform:rotateY(180deg);background:#f4f7fb}
.fc-nl{font-family:"Fraunces",serif;font-size:1.9rem;margin-bottom:.45rem}
.fc-cat{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.9rem}
.fc-hint{font-size:.82rem;color:var(--muted);font-style:italic}
.fc-en{font-size:1.3rem;font-weight:700;margin-bottom:.55rem}
.fc-ex{font-size:.92rem;color:var(--ink);font-style:italic;margin-bottom:.3rem}
.fc-ex-en{font-size:.88rem;color:var(--muted)}
.vocab-nav{display:flex;justify-content:space-between;align-items:center;margin-top:.85rem}

/* ── GRAMMAR ── */
.rule-card{margin-bottom:1.2rem}
.rule-title{font-size:1.05rem;font-weight:700;margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.rule-badge{background:#ffe8d6;color:var(--accent);font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;text-transform:uppercase}
.pattern-box{background:#1a2332;color:#f7f3eb;border-radius:10px;padding:.65rem 1rem;font-family:monospace;font-size:.9rem;margin:.55rem 0}
.ex-table{width:100%;border-collapse:collapse;margin:.5rem 0}
.ex-table td{padding:.4rem .6rem;border:1px solid var(--line);font-size:.92rem}
.ex-table td:first-child{font-weight:600;background:#f8f5f0;width:52%}
.ex-table td em{color:var(--accent)}
/* exercises */
.exercise{border-left:3px solid var(--sea);padding:.65rem .85rem;margin-bottom:.7rem;background:#f8fdfc}
.exercise h4{font-size:.9rem;font-weight:700;margin-bottom:.5rem}
.ex-item{margin-bottom:.55rem}
.ex-item .stem{font-size:.93rem;margin-bottom:.3rem}
.option-btn{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:.3rem .7rem;margin:.2rem;font-size:.85rem;cursor:pointer;transition:.15s}
.option-btn:hover:not(:disabled){border-color:var(--sea);color:var(--sea)}
.option-btn.correct{background:#e8f8ef;border-color:var(--ok);color:var(--ok);font-weight:700}
.option-btn.wrong{background:#fde8e8;border-color:var(--red);color:var(--red)}
.fillblank-input{border:1px solid var(--line);border-radius:8px;padding:.3rem .6rem;width:120px;margin:0 .3rem}

/* ── READING / LISTENING ── */
.text-body{font-size:1.02rem;line-height:1.75;color:var(--ink)}
.text-para{margin-bottom:1rem}
.text-en-para{font-size:.9rem;color:var(--muted);font-style:italic;margin-bottom:.9rem;border-left:3px solid var(--line);padding-left:.6rem}
.qcard{background:#f8f5f0;border-radius:12px;padding:.85rem 1rem;margin-bottom:.6rem}
.qcard strong{font-size:.9rem;display:block;margin-bottom:.35rem}
.qcard .answer{font-size:.88rem;color:var(--sea);display:none}
.qcard.revealed .answer{display:block}
.listen-controls{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.speed-btn{padding:.28rem .65rem;font-size:.78rem;border-radius:8px}
.sent-row{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem 0;border-bottom:1px dashed var(--line)}
.sent-row:last-child{border:0}
.sent-nl{flex:1;font-size:.97rem}
.sent-en{font-size:.88rem;color:var(--muted);flex:1;font-style:italic}
.hidden-text{filter:blur(4px);pointer-events:none;user-select:none}

/* ── SPEAKING ── */
.speak-prompt-box{border-left:4px solid var(--accent);padding:.8rem 1rem;background:#fff9f5;border-radius:0 12px 12px 0;margin-bottom:.9rem;font-size:1.02rem}
.speak-prompt-en{color:var(--muted);font-size:.9rem;margin-top:.3rem;font-style:italic}
.useful-phrases{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.phrase-chip{background:var(--sea-soft);color:var(--sea);border:1px solid #c8e0de;border-radius:999px;padding:.2rem .65rem;font-size:.8rem;cursor:pointer}
.phrase-chip:hover{background:#c8e0de}
.sample-answer{border-top:1px dashed var(--line);padding-top:.85rem;margin-top:.85rem}
.sample-nl{font-size:.97rem;line-height:1.75;white-space:pre-wrap;margin:.4rem 0}
.sample-en{font-size:.88rem;color:var(--muted);font-style:italic;white-space:pre-wrap}
.rec-btn{display:flex;align-items:center;gap:.45rem;padding:.55rem 1.1rem;border-radius:999px;font-size:.9rem;font-weight:700;border:2px solid var(--accent);background:#fff;cursor:pointer;transition:.15s}
.rec-btn.listening{background:var(--accent);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,92,38,.3)}50%{box-shadow:0 0 0 8px rgba(196,92,38,0)}}

/* ── LAB / TEST ── */
.status-pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;background:#f0ece4;color:var(--muted)}
.status-pill.ok{background:var(--sea-soft);color:var(--sea)}
.status-pill.warn{background:#fff4d6;color:#8a6a00}
.lab-toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.85rem}
.folder-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.28rem .75rem;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--muted)}
.folder-chip.active{background:var(--sea);border-color:var(--sea);color:#fff}
.track-list{display:flex;flex-direction:column;gap:.25rem;max-height:280px;overflow:auto;margin:.5rem 0 1rem}
.track-btn{text-align:left;border:1px solid transparent;background:#fff;border-radius:10px;padding:.4rem .7rem;font-size:.85rem;cursor:pointer}
.track-btn:hover{border-color:var(--line);background:#f8f5f0}
.track-btn.active{background:var(--sea-soft);border-color:#c8e0de;font-weight:700;color:var(--sea)}
.real-audio{width:100%;margin:.55rem 0}
.script-line{padding:.4rem 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.script-en{font-size:.85rem;color:var(--muted);font-style:italic}
.timer-bar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:var(--r);padding:.75rem 1rem;margin-bottom:.85rem}
.timer-clock{font-family:"Fraunces",serif;font-size:1.8rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.timer-bar.low{background:#7a1f18}
.test-part{border-top:1px dashed var(--line);padding-top:.85rem;margin-top:.85rem}
.test-part h4{font-size:1rem;margin-bottom:.45rem}
.note-area{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:.55rem;font-size:.9rem}
.rec-result{margin-top:.65rem;padding:.65rem .9rem;background:#f4f7fb;border-radius:12px;font-size:.93rem;min-height:3rem}
.rec-audio{display:none;width:100%;margin-top:.55rem}
.rec-audio.show{display:block}
.btn.listening,.rec-btn.listening{background:var(--accent);color:#fff;border-color:var(--accent);animation:pulse 1.2s infinite}

/* ── WRITING ── */
.writing-prompt{font-size:1.05rem;line-height:1.65;margin-bottom:.85rem}
.writing-area{width:100%;min-height:180px;border:1px solid var(--line);border-radius:12px;padding:.85rem;resize:vertical;background:#fff;font-size:.97rem;line-height:1.7}
.writing-area:focus{outline:none;border-color:var(--sea)}
.word-count{font-size:.8rem;color:var(--muted);text-align:right;margin:.3rem 0 .6rem}
.word-count.ok{color:var(--ok);font-weight:700}
.writing-tip{font-size:.88rem;background:#fffbf0;border:1px solid #f0e6c0;border-radius:10px;padding:.6rem .85rem;margin-bottom:.65rem;color:#6b5000}
.saved-indicator{font-size:.8rem;color:var(--ok);margin-left:.5rem;opacity:0;transition:.3s}
.saved-indicator.show{opacity:1}

/* ── progress dots ── */
.prog-row{display:flex;gap:.3rem;flex-wrap:wrap;margin:.35rem 0}
.prog-dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.prog-dot.known{background:var(--sea)}
.prog-dot.active{background:var(--accent)}

/* ── responsive ── */
@media(max-width:600px){
  .topbar{padding:.5rem .7rem;gap:.5rem}
  .ch-tabs{gap:.2rem}
  .ch-tab{padding:.22rem .55rem;font-size:.72rem}
  .fc-nl{font-size:1.5rem}
  .wrap{padding:.85rem .7rem 2.5rem}
}
</style>
</head>
<body>

<!-- ── top nav ── -->
<div class="topbar">
  <h1>Dutch B1</h1>
  <div class="ch-tabs" id="chTabs"></div>
</div>

<!-- ── module nav ── -->
<div class="mod-nav" id="modNav">
  <button class="mod-btn active" data-mod="vocab">  <span class="mod-icon">🃏</span> Vocab</button>
  <button class="mod-btn" data-mod="grammar"><span class="mod-icon">📐</span> Grammar</button>
  <button class="mod-btn" data-mod="reading"><span class="mod-icon">📖</span> Reading</button>
  <button class="mod-btn" data-mod="listening"><span class="mod-icon">🎧</span> Listening</button>
  <button class="mod-btn" data-mod="speaking"><span class="mod-icon">🎤</span> Speaking</button>
  <button class="mod-btn" data-mod="writing"><span class="mod-icon">✍️</span> Writing</button>
  <button class="mod-btn" data-mod="lab"><span class="mod-icon">💿</span> CD Lab</button>
  <button class="mod-btn" data-mod="test"><span class="mod-icon">⏱</span> 30-min test</button>
</div>

<div class="wrap">
  <!-- chapter heading -->
  <div class="ch-header">
    <div class="ch-eyebrow" id="chEyebrow"></div>
    <h2 id="chTitle"></h2>
    <div class="ch-focus" id="chFocus"></div>
  </div>

  <!-- ── VOCAB panel ── -->
  <div class="panel active" id="panel-vocab">
    <div class="vocab-controls">
      <button class="btn btn-sm" id="vcShuffle">🔀 Shuffle</button>
      <button class="btn btn-sm" id="vcUnknown">⭐ Unknown only</button>
      <button class="btn btn-sm" id="vcAll">All</button>
      <button class="btn btn-sm" id="vcReset">Reset known</button>
    </div>
    <div class="vocab-stat"><span id="vcKnownCount">0</span> / <span id="vcTotal">0</span> known &nbsp;·&nbsp; card <span id="vcPos">1</span></div>
    <div class="prog-row" id="progDots"></div>
    <div class="vocab-progress"><div class="vocab-progress-fill" id="vcFill"></div></div>
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="flashcard-inner" id="fcInner">
        <div class="fc-face fc-front">
          <div class="fc-cat" id="fcCat"></div>
          <div class="fc-nl" id="fcNl"></div>
          <div class="fc-hint">tap to reveal</div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-en" id="fcEn"></div>
          <div class="fc-ex" id="fcEx"></div>
          <div class="fc-ex-en" id="fcExEn"></div>
        </div>
      </div>
    </div>
    <div class="vocab-nav">
      <button class="btn" onclick="vcNav(-1)">← Prev</button>
      <div class="btn-row" style="gap:.4rem">
        <button class="btn btn-sm btn-icon" id="speakWordBtn" onclick="speakCurrentWord()" title="Hear pronunciation">🔊</button>
        <button class="btn btn-sm btn-icon" onclick="speakExample()" title="Hear example sentence">▶ Example</button>
        <button class="btn btn-sm" style="background:#e8f8ef;border-color:#2d6a4f;color:#2d6a4f" onclick="markKnown()">✓ Known</button>
        <button class="btn btn-sm" style="background:#fde8e8;border-color:#c0392b;color:#c0392b" onclick="markUnknown()">✗ Again</button>
      </div>
      <button class="btn" onclick="vcNav(1)">Next →</button>
    </div>
  </div>

  <!-- ── GRAMMAR panel ── -->
  <div class="panel" id="panel-grammar">
    <div id="grammarContent"></div>
  </div>

  <!-- ── READING panel ── -->
  <div class="panel" id="panel-reading">
    <div id="readingContent"></div>
  </div>

  <!-- ── LISTENING panel ── -->
  <div class="panel" id="panel-listening">
    <div id="listeningContent"></div>
  </div>

  <!-- ── CD LAB panel ── -->
  <div class="panel" id="panel-lab">
    <div id="labContent"></div>
  </div>

  <!-- ── 30-MIN TEST panel ── -->
  <div class="panel" id="panel-test">
    <div id="testContent"></div>
  </div>

  <!-- ── SPEAKING panel ── -->
  <div class="panel" id="panel-speaking">
    <div id="speakingContent"></div>
  </div>

  <!-- ── WRITING panel ── -->
  <div class="panel" id="panel-writing">
    <div id="writingContent"></div>
  </div>
</div>

<input type="file" id="pickAudioFiles" accept="audio/*,.mp3" multiple hidden/>
<input type="file" id="pickAudioDir" accept="audio/*,.mp3" webkitdirectory multiple hidden/>

<script>
// ════════════════════════════════════════════════════════════════════
// CONTENT DATA — all 8 Contact! 2 chapters
// ════════════════════════════════════════════════════════════════════
const CHAPTERS = [
{
  id:1, title:"Gisteren, vandaag, morgen",
  focus:"Plannen · ambities · bijzinnen · indirecte rede",
  vocab:[
    {nl:"de ambitie",en:"ambition",ex:"Ik heb de ambitie om arts te worden.",exEn:"I have the ambition to become a doctor."},
    {nl:"het plan",en:"plan / intention",ex:"Wat zijn jouw plannen voor de toekomst?",exEn:"What are your plans for the future?"},
    {nl:"de toekomst",en:"future",ex:"De toekomst is onzeker, maar ik ben optimistisch.",exEn:"The future is uncertain, but I'm optimistic."},
    {nl:"het verleden",en:"past",ex:"In het verleden werkte hij als kok.",exEn:"In the past he worked as a cook."},
    {nl:"het doel",en:"goal / aim",ex:"Mijn doel is om vloeiend Nederlands te spreken.",exEn:"My goal is to speak Dutch fluently."},
    {nl:"de carrière",en:"career",ex:"Ze wil een carrière in de geneeskunde.",exEn:"She wants a career in medicine."},
    {nl:"de opleiding",en:"education / training",ex:"Hij volgt een opleiding tot leraar.",exEn:"He is doing teacher training."},
    {nl:"de ervaring",en:"experience",ex:"Heb je werkervaring in de zorg?",exEn:"Do you have work experience in healthcare?"},
    {nl:"verwachten",en:"to expect",ex:"Ik verwacht dat het moeilijk wordt.",exEn:"I expect it to be difficult."},
    {nl:"hopen",en:"to hope",ex:"We hopen dat je snel beter wordt.",exEn:"We hope you get better soon."},
    {nl:"van plan zijn",en:"to intend / to plan",ex:"Ik ben van plan om te gaan studeren.",exEn:"I plan to study."},
    {nl:"slagen (voor)",en:"to pass (an exam)",ex:"Hij is geslaagd voor zijn rijexamen.",exEn:"He passed his driving test."},
    {nl:"bereiken",en:"to achieve / to reach",ex:"Ze heeft haar doel bereikt.",exEn:"She achieved her goal."},
    {nl:"bijdragen aan",en:"to contribute to",ex:"Iedereen kan bijdragen aan een betere samenleving.",exEn:"Everyone can contribute to a better society."},
    {nl:"veranderen",en:"to change",ex:"Veel dingen zijn veranderd in tien jaar.",exEn:"A lot has changed in ten years."},
    {nl:"verbeteren",en:"to improve",ex:"Ik wil mijn Nederlands verbeteren.",exEn:"I want to improve my Dutch."},
    {nl:"geloven (dat)",en:"to believe (that)",ex:"Ik geloof dat ik het kan.",exEn:"I believe that I can do it."},
    {nl:"dromen van",en:"to dream of",ex:"Ze droomt van een huis in de bergen.",exEn:"She dreams of a house in the mountains."},
    {nl:"overtuigd zijn",en:"to be convinced",ex:"Ik ben ervan overtuigd dat dit lukt.",exEn:"I am convinced this will succeed."},
    {nl:"vooruitkomen",en:"to get ahead / progress",ex:"Door hard werken kom je vooruit.",exEn:"By working hard, you get ahead."},
  ],
  grammar:{
    points:[
      {
        title:"Bijzinnen — werkwoord achteraan",
        badge:"Bijzin",
        explanation:"In een bijzin staat het werkwoord altijd aan het <em>eind</em>. Veelgebruikte voegwoorden: <strong>dat, omdat, terwijl, als, toen, zodat, hoewel, wanneer, voordat, nadat</strong>.",
        pattern:"HOOFDZIN + VOEGWOORD + onderwerp … + WERKWOORD",
        examples:[
          {nl:"Ik weet <em>dat hij morgen komt</em>.", en:"I know <em>that he is coming tomorrow</em>."},
          {nl:"Ze werkt hard <em>omdat ze wil slagen</em>.", en:"She works hard <em>because she wants to succeed</em>."},
          {nl:"Hij luistert muziek <em>terwijl hij kookt</em>.", en:"He listens to music <em>while he cooks</em>."},
          {nl:"<em>Als je hard werkt</em>, kom je verder.", en:"<em>If you work hard</em>, you will get further."},
        ]
      },
      {
        title:"Indirecte rede",
        badge:"Rapporteren",
        explanation:"Gebruik <strong>dat</strong> + bijzin om te rapporteren wat iemand zei. Tijden verschuiven (presens → verleden).",
        pattern:"Hij zegt/zei DAT + onderwerp … + WERKWOORD (achteraan)",
        examples:[
          {nl:"Direct: \"Ik ga morgen naar Utrecht.\"", en:"Direct: \"I'm going to Utrecht tomorrow.\""},
          {nl:"Indirect: Hij <em>zegt dat</em> hij morgen naar Utrecht <em>gaat</em>.", en:"Indirect: He <em>says that</em> he is going to Utrecht tomorrow."},
          {nl:"Ze <em>vertelde dat</em> ze haar diploma <em>had gehaald</em>.", en:"She <em>told us that</em> she had obtained her diploma."},
        ]
      }
    ],
    exercises:[
      {
        id:"h1ex1",

  reading:{
    title:"Van mbo naar hbo: een loopbaanswitch",
    paras:[
      "Steeds meer Nederlandse werknemers besluiten om, soms halverwege hun carrière, een nieuwe opleiding te volgen. De overgang van mbo- naar hbo-niveau is daarbij een populaire route. Maar hoe verloopt zo'n switch in de praktijk, en welke obstakels komen mensen daarbij tegen?",
      "Fatima werkte acht jaar als administratief medewerker bij een logistiek bedrijf. Ze had een mbo-diploma niveau 4, maar voelde dat ze was vastgelopen. 'Ik deed elke dag hetzelfde', vertelt ze. 'Ik had de ambitie om meer verantwoordelijkheid te dragen, maar zonder hbo-diploma kwamen de promoties altijd aan anderen.' Twee jaar geleden begon ze aan een deeltijdopleiding bedrijfskunde aan de hogeschool.",
      "De combinatie van werk en studie valt niet mee. Fatima studeert doordeweeks twee avonden en besteedt de zaterdagochtend aan groepsprojecten. 'Het vergt discipline', geeft ze toe. 'Maar mijn werkgever vindt het goed omdat ik wat ik leer direct toepas.' Dat is een patroon dat vaker voorkomt: bedrijven investeren steeds vaker in de scholing van bestaand personeel, omdat het goedkoper is dan nieuw talent werven.",
      "Niet iedereen is even enthousiast. Critici wijzen erop dat het hbo soms te theoretisch is voor mensen die al jaren werkervaring hebben. Bovendien is het combineren van een studie, een baan en een gezin uitputtend. De uitval onder werkende studenten is dan ook hoger dan onder voltijdstudenten.",
      "Toch blijft de motivatie bij Fatima hoog. 'Ik verwacht dat ik volgend jaar mijn propedeuse haal', zegt ze. 'En daarna wil ik me specialiseren in supply chain management. Het doel is niet alleen een hoger salaris, maar ook het gevoel dat ik me heb kunnen ontwikkelen. Dat is, denk ik, wat echte ambitie inhoudt.'",
    ],
    parasEn:[
      "More and more Dutch employees decide to pursue a new degree, sometimes mid-career. The transition from vocational (mbo) to higher professional (hbo) level is a popular route. But how does such a switch work in practice, and what obstacles do people encounter?",
      "Fatima worked eight years as an administrative employee at a logistics company. She had an mbo level-4 diploma but felt she had stagnated. 'I did the same thing every day,' she says. 'I had ambitions to take on more responsibility, but without an hbo diploma the promotions always went to others.' Two years ago she started a part-time business administration degree at a university of applied sciences.",
      "Combining work and study is tough. Fatima studies two evenings a week and spends Saturday mornings on group projects. 'It requires discipline,' she admits. 'But my employer approves because I apply what I learn directly.' That is a pattern seen more often: companies increasingly invest in the training of existing staff because it is cheaper than recruiting new talent.",

  reading:{
    title:"Hoe journalisten controleren wat iemand bedoelt",
    paras:[
      "Communicatie gaat regelmatig mis — ook in de journalistiek. Een politicus zegt iets, een journalist schrijft het op, maar de volgende dag kopt de krant iets wat de spreker nooit bedoeld heeft. Hoe komt dat, en wat doen goede journalisten om dat te voorkomen?",
      "Het probleem begint vaak bij vage uitspraken. Politici en bestuurders gebruiken met opzet abstracte taal om meerdere groepen tegelijk tevreden te stellen. Een uitspraak als 'we investeren in de toekomst van onderwijs' klinkt positief, maar zegt weinig concreets. Een ervaren journalist vraagt dan door: 'Wat bedoelt u precies? Om hoeveel geld gaat het, en voor welke scholen?' Verduidelijking is essentieel voor betrouwbare berichtgeving.",
      "Naast doorvragen is bronverificatie een tweede sleutelvaardigheid. Journalisten controleren of wat iemand beweert ook klopt met andere bronnen. Als een wethouder zegt dat het criminaliteitscijfer gedaald is, zoeken journalisten de officiële politiestatistieken erbij. Als die anders zijn, vragen ze om opheldering: 'De cijfers die ik heb, laten iets anders zien. Kunt u dat bevestigen of toelichten?'",
      "Een derde techniek is parafraseren: de journalist vat samen wat de geïnterviewde heeft gezegd en vraagt of dat klopt. 'Als ik het goed begrijp, bedoelt u dat de gemeente het plan volgend jaar wil uitvoeren, niet dit jaar?' Door de woorden van de ander te herhalen in eigen bewoordingen, wordt snel duidelijk of er een misverstand is ontstaan.",
      "Al deze technieken hebben één gemeenschappelijk doel: zorgen dat de lezer of kijker een zo nauwkeurig mogelijk beeld krijgt van de werkelijkheid. In een tijdperk van desinformatie en nepnieuws is dat belangrijker dan ooit. Want taal, zo leert de journalistiek ons, is zelden zo transparant als ze lijkt.",
    ],
    parasEn:[
      "Communication regularly goes wrong — including in journalism. A politician says something, a journalist writes it down, but the next day the newspaper headlines something the speaker never intended. How does that happen, and what do good journalists do to prevent it?",
      "The problem often starts with vague statements. Politicians and administrators deliberately use abstract language to satisfy multiple groups at once. A statement like 'we are investing in the future of education' sounds positive but says little concrete. An experienced journalist then probes further: 'What exactly do you mean? How much money is involved, and for which schools?' Clarification is essential for reliable reporting.",
      "Besides follow-up questions, source verification is a second key skill. Journalists check whether what someone claims also matches other sources. If an alderman says that crime rates have fallen, journalists look up the official police statistics. If these differ, they ask for clarification: 'The figures I have show something different. Can you confirm or explain that?'",
      "A third technique is paraphrasing: the journalist summarises what the interviewee has said and asks if that is correct. 'If I understand correctly, you mean that the municipality wants to implement the plan next year, not this year?' By repeating the other person's words in their own formulation, misunderstandings quickly become apparent.",
      "All these techniques share one common goal: ensuring that readers or viewers get as accurate a picture of reality as possible. In an era of disinformation and fake news, that matters more than ever. Because language, as journalism teaches us, is rarely as transparent as it seems.",
    ],
    questions:[
      {q:"Waarom gebruiken politici volgens de tekst bewust vage taal?",a:"Om meerdere groepen tegelijk tevreden te stellen."},
      {q:"Wat doet een journalist als officiële statistieken afwijken van wat een bestuurder beweert?",a:"De journalist vraagt om opheldering en vraagt de bestuurder het verschil te bevestigen of toe te lichten."},
      {q:"Wat is het doel van de parafrasetechniek die journalisten gebruiken?",a:"Controleren of de journalist de geïnterviewde goed heeft begrepen en misverstanden snel ophelderen."},
      {q:"Wat heeft de tekst als overkoepelende boodschap over taal?",a:"Taal is minder transparant dan het lijkt; nauwkeurige verificatie en verduidelijking zijn nodig voor betrouwbare communicatie."},
      {q:"In welk opzicht verschilt bronverificatie van doorvragen?",a:"Doorvragen richt zich op de spreker zelf; bronverificatie vergelijkt uitspraken met onafhankelijke, externe bronnen."},

      {nl:"Goedemiddag en welkom bij het radiospreekuur van Werk & Taal. Onze eerste beller is Mirela uit Utrecht. Mirela, waar loopt u tegenaan?",en:"Good afternoon and welcome to the Werk & Taal radio phone-in. Our first caller is Mirela from Utrecht. Mirela, what issue are you running into?"},
      {nl:"Dag. Ik werk nu twee jaar in Nederland en mijn Nederlands gaat steeds beter, maar op mijn werk snap ik soms de instructies niet helemaal. Mijn leidinggevende praat erg snel en gebruikt veel vakjargon.",en:"Hello. I have been working in the Netherlands for two years now and my Dutch is improving, but I sometimes don't fully understand the instructions at work. My manager speaks very fast and uses a lot of jargon."},
      {nl:"Dat herkennen veel mensen. Wat heeft u al geprobeerd?",en:"A lot of people recognise that. What have you already tried?"},
      {nl:"Ik vraag soms om herhaling, maar dan voelt het alsof ik stoor. Ik wil niet de indruk wekken dat ik niet competent ben.",en:"I sometimes ask for repetition, but then it feels like I'm interrupting. I don't want to give the impression that I'm not competent."},
      {nl:"Dat gevoel is heel begrijpelijk. Maar bedenk: vragen om verduidelijking is juist een teken van professionaliteit, niet van zwakte. Heeft u zinnen zoals 'Als ik het goed begrijp, bedoelt u dat…' al geprobeerd?",en:"That feeling is very understandable. But consider: asking for clarification is actually a sign of professionalism, not weakness. Have you tried phrases like 'If I understand correctly, you mean that…'?"},
      {nl:"Nee, die kende ik niet. Dat klinkt beleefder dan gewoon 'wat?'",en:"No, I didn't know those. That sounds more polite than just saying 'what?'"},

  reading:{
    title:"Diversiteit op de werkvloer: meer dan een poster aan de muur",
    paras:[
      "Diversiteitsbeleid staat hoog op de agenda van veel Nederlandse bedrijven. Ze publiceren jaarverslagen met mooie grafieken over de verhouding mannen en vrouwen, de culturele achtergronden van medewerkers of het percentage mensen met een beperking. Maar klopt het beeld dat die cijfers schetsen ook met de dagelijkse praktijk?",
      "Onderzoekers van de Universiteit van Amsterdam publiceerden vorig jaar een rapport waaruit blijkt dat diversiteit op papier en diversiteit in de praktijk nog ver uit elkaar liggen. Bedrijven werven weliswaar meer mensen met uiteenlopende achtergronden, maar de doorstroom naar leidinggevende functies blijft achter. Een medewerker met een niet-westerse naam maakt statistisch gezien minder kans op een uitnodiging voor een sollicitatiegesprek, zelfs als zijn cv identiek is aan dat van een kandidaat met een typisch Nederlandse naam.",
      "Diversiteit gaat overigens niet alleen over etniciteit of geslacht. Persoonlijkheidsverschillen spelen een net zo grote rol op de werkvloer. Introvertere medewerkers presteren doorgaans beter in rustige, gestructureerde omgevingen, terwijl extravertere collega's floreren in dynamische settings met veel klantcontact. Een goede manager herkent die verschillen en past zijn leiderschapsstijl aan, in plaats van iedereen over dezelfde kam te scheren.",
      "Critici waarschuwen dat diversiteitsbeleid kan verworden tot een symbolische oefening als er geen concrete maatregelen aan gekoppeld zijn. Trainingen over onbewuste vooroordelen helpen, maar alleen als de organisatiecultuur zelf verandert. Dat vraagt meer dan een cursus; het vraagt om een fundamentele herziening van hoe beslissingen worden genomen en wie daarin een stem krijgt.",
      "Al met al is de conclusie genuanceerd. Diversiteit op de werkvloer levert aantoonbaar betere resultaten op als zij gepaard gaat met een inclusieve cultuur. Bedrijven die alleen focussen op de cijfers, missen de kern. Want mensen zijn meer dan statistieken — ze zijn individuen met specifieke talenten, en het is precies die combinatie van verschillen die een team sterker maakt.",
    ],
    parasEn:[
      "Diversity policy is high on the agenda of many Dutch companies. They publish annual reports with attractive graphs about the ratio of men and women, the cultural backgrounds of employees or the percentage of people with a disability. But does the picture those figures paint match daily practice?",
      "Researchers at the University of Amsterdam published a report last year showing that diversity on paper and diversity in practice are still far apart. Companies do recruit more people with diverse backgrounds, but progression to management positions lags behind. An employee with a non-western name is statistically less likely to be invited for a job interview, even when their CV is identical to that of a candidate with a typically Dutch name.",
      "Diversity, incidentally, is not only about ethnicity or gender. Personality differences play an equally important role in the workplace. More introverted employees generally perform better in quiet, structured environments, while more extroverted colleagues thrive in dynamic settings with a lot of client contact. A good manager recognises those differences and adapts their leadership style, rather than treating everyone the same.",
      "Critics warn that diversity policy can become a symbolic exercise if no concrete measures are attached to it. Unconscious-bias training helps, but only if the organisational culture itself changes. That requires more than a course; it requires a fundamental revision of how decisions are made and who gets a voice in them.",
      "All in all the conclusion is nuanced. Diversity in the workplace demonstrably produces better results when it is accompanied by an inclusive culture. Companies that only focus on the numbers miss the point. Because people are more than statistics — they are individuals with specific talents, and it is precisely that combination of differences that makes a team stronger.",
    ],
    questions:[
      {q:"Wat is het verschil tussen diversiteit op papier en in de praktijk dat het rapport beschrijft?",a:"Bedrijven werven meer diverse medewerkers, maar de doorstroom naar leidinggevende functies blijft achter."},
      {q:"Welk concreet voorbeeld noemt de tekst als bewijs van discriminatie bij werving?",a:"Een kandidaat met een niet-westerse naam maakt statistisch minder kans op een uitnodiging, ook bij een identiek cv."},
      {q:"Wat bedoelen critici met een 'symbolische oefening' op het gebied van diversiteitsbeleid?",a:"Dat beleid neerkomt op mooie woorden of trainingen zonder echte cultuurverandering in de organisatie."},
      {q:"Waarom is persoonlijkheidsdiversiteit volgens de tekst minstens zo belangrijk als demografische diversiteit?",a:"Omdat introvertere en extravertere medewerkers in verschillende omgevingen beter presteren, en een goede manager daar zijn stijl op moet afstemmen."},
      {q:"Wat is de centrale boodschap van de laatste alinea?",a:"Diversiteit werkt alleen als er ook een inclusieve cultuur is; mensen zijn individuen, geen statistieken, en hun combinatie van talenten maakt het team sterker."},

  listening:{
    title:"Beladvies: omgaan met collega's die anders werken",
    sents:[
      {nl:"Goedemiddag, u luistert naar Werk & Welzijn. Onze gast vandaag is arbeidspsycholoog Nora Hendriksen. Nora, we krijgen veel vragen over samenwerking op de werkvloer. Waar loopt men het vaakst tegenaan?",en:"Good afternoon, you are listening to Work & Well-being. Our guest today is occupational psychologist Nora Hendriksen. Nora, we receive a lot of questions about collaboration in the workplace. What do people most often struggle with?"},
      {nl:"Wat ik het meest hoor is dat collega's moeite hebben met mensen die heel anders werken. De één wil alles plannen en structureren, de ander werkt liever op gevoel en reageert flexibel op situaties. Dat botst regelmatig.",en:"What I hear most often is that colleagues struggle with people who work very differently. One person wants to plan and structure everything, the other prefers to work intuitively and respond flexibly to situations. That clashes regularly."},
      {nl:"En hoe lost u dat op?",en:"And how do you resolve that?"},
      {nl:"Ten eerste: begrijpen dat geen van beide stijlen 'fout' is. Ze zijn gewoon anders. De planmatige werker is betrouwbaarder in projecten met strakke deadlines, terwijl de flexibele werker beter omgaat met onverwachte situaties. Je hebt beide typen nodig.",en:"First: understand that neither style is 'wrong'. They are simply different. The structured worker is more reliable in projects with tight deadlines, while the flexible worker handles unexpected situations better. You need both types."},
      {nl:"Maar wat als de samenwerking echt stroef verloopt?",en:"But what if the collaboration is really strained?"},
      {nl:"Dan raad ik aan om het gesprek aan te gaan, liefst buiten een vergadersetting. Vraag hoe je collega het liefst werkt en leg ook uit hoe jij het prettigst werkt. Dat klinkt simpel, maar het wordt zelden gedaan.",en:"Then I recommend having a conversation, preferably outside a meeting setting. Ask how your colleague prefers to work and also explain how you work best. That sounds simple, but it is rarely done."},
      {nl:"Speelt culturele achtergrond ook een rol?",en:"Does cultural background also play a role?"},
      {nl:"Zeker. In sommige culturen is het onbeleefd om direct kritiek te geven; in de Nederlandse cultuur wordt directheid juist gewaardeerd. Als je dat niet weet, kan een eerlijk commentaar al snel als aanval worden ervaren.",en:"Certainly. In some cultures it is impolite to give direct criticism; in Dutch culture, directness is actually valued. If you don't know that, an honest comment can quickly be experienced as an attack."},
      {nl:"Wat zou u medewerkers adviseren die zich onbegrepen voelen?",en:"What would you advise employees who feel misunderstood?"},
      {nl:"Investeer in het leren kennen van je collega's als mensen, niet alleen als werkers. Vraag naar hun achtergrond en interesses. Een beetje persoonlijk contact gaat verder dan welk diversiteitstraining ook.",en:"Invest in getting to know your colleagues as people, not just as workers. Ask about their background and interests. A little personal contact goes further than any diversity training."},
      {nl:"Tot slot: wat is uw belangrijkste advies voor managers?",en:"Finally: what is your most important advice for managers?"},
      {nl:"Stop met iedereen over dezelfde kam scheren. Een goede manager past zijn stijl aan per medewerker. Dat vraagt empathie, maar het loont enorm.",en:"Stop treating everyone the same. A good manager adapts their style to each employee. That requires empathy, but it pays off enormously."},
    ]
  },

  reading:{
    title:"Meedoen aan de buurt: hoe burgerparticipatie werkt in Nederland",
    paras:[
      "In steeds meer Nederlandse gemeenten worden bewoners actief betrokken bij beslissingen over hun leefomgeving. Dit heet burgerparticipatie. In plaats van dat de gemeente eenzijdig bepaalt waar een speeltuin komt of hoe een park wordt ingericht, worden bewoners gevraagd mee te denken en mee te beslissen. Maar hoe werkt dat in de praktijk, en wie doet er eigenlijk aan mee?",
      "De meest gebruikte methode is de bewonersbijeenkomst. De gemeente nodigt inwoners uit om ideeën in te dienen over een specifiek onderwerp — bijvoorbeeld de herinrichting van een plein of de aanleg van een fietspad. Soms wordt er online een enquête gestuurd; in andere gevallen zijn er fysieke bijeenkomsten in buurthuizen of wijkcentra. De gemeente belooft dan de inzending serieus te nemen, al hoeven de voorstellen niet altijd te worden uitgevoerd.",
      "Critici wijzen op een structureel probleem: niet iedereen doet evenveel mee. Burgerparticipatie trekt vaker hoger opgeleide en oudere bewoners, terwijl jongeren, laaggeletterden en mensen met een migratieachtergrond ondervertegenwoordigd zijn. Daardoor weerspiegelen de uitkomsten niet altijd de werkelijke wensen van de hele buurt.",
      "Er zijn ook positieve voorbeelden. In Amsterdam-Noord werd een braakliggend terrein omgevormd tot een stadslandbouwproject nadat bewoners massaal hadden gereageerd op een oproep van de deelgemeente. Het initiatief werd volledig door vrijwilligers gedragen. Er wordt nu groente geteeld, er worden workshops georganiseerd en er is een gemeenschapstuin aangelegd.",
      "De sleutel tot succesvolle participatie is, volgens gemeenteambtenaren, transparantie. Bewoners moeten weten wat er met hun inbreng gedaan wordt. Als een voorstel niet wordt overgenomen, moet de gemeente uitleggen waarom. Alleen dan voelen mensen zich echt gehoord — en dat is de basis van vertrouwen tussen burger en bestuur.",
    ],
    parasEn:[
      "In more and more Dutch municipalities, residents are actively involved in decisions about their living environment. This is called citizen participation. Instead of the municipality unilaterally deciding where a playground goes or how a park is designed, residents are asked to think and decide together. But how does that work in practice, and who actually participates?",
      "The most commonly used method is the residents' meeting. The municipality invites residents to submit ideas about a specific topic — for example the redesign of a square or the construction of a cycle path. Sometimes an online survey is sent; in other cases there are physical meetings in community centres or neighbourhood centres. The municipality then promises to take the submissions seriously, though proposals do not always have to be implemented.",
      "Critics point to a structural problem: not everyone participates equally. Citizen participation attracts more highly educated and older residents, while young people, those with low literacy and people with a migration background are underrepresented. As a result, the outcomes do not always reflect the actual wishes of the entire neighbourhood.",
      "There are also positive examples. In Amsterdam-Noord, a vacant plot was transformed into an urban farming project after residents responded en masse to a call from the sub-municipality. The initiative was carried entirely by volunteers. Vegetables are now grown, workshops are organised and a community garden has been created.",
      "The key to successful participation is, according to municipal officials, transparency. Residents need to know what is done with their input. If a proposal is not adopted, the municipality must explain why. Only then do people truly feel heard — and that is the foundation of trust between citizens and government.",
    ],
    questions:[
      {q:"Wat is het verschil tussen traditionele gemeentelijke besluitvorming en burgerparticipatie?",a:"Bij traditionele besluitvorming bepaalt de gemeente eenzijdig; bij burgerparticipatie worden bewoners gevraagd mee te denken en mee te beslissen."},
      {q:"Welke groepen zijn volgens de tekst ondervertegenwoordigd bij burgerparticipatie?",a:"Jongeren, laaggeletterden en mensen met een migratieachtergrond."},
      {q:"Wat maakt het voorbeeld in Amsterdam-Noord bijzonder?",a:"Het project werd volledig door vrijwilligers gedragen en bevat groenteteelt, workshops en een gemeenschapstuin op een voormalig braakliggend terrein."},
      {q:"Waarom is transparantie essentieel voor succesvolle participatie?",a:"Bewoners moeten weten wat er met hun inbreng gedaan wordt; als voorstellen niet worden overgenomen, moet de gemeente uitleggen waarom, anders voelen mensen zich niet gehoord."},
      {q:"Wat kun je opmaken uit het feit dat de gemeente belooft inzendingen serieus te nemen, maar niet verplicht is ze uit te voeren?",a:"Burgerparticipatie is adviserend, niet bindend — de gemeente houdt de uiteindelijke beslissingsmacht."},

  listening:{
    title:"Nieuws: wijkoverleg over nieuw fietspad",
    sents:[
      {nl:"Goedenavond. U luistert naar het Regionieuws. Vanavond in het programma: bewoners van de Rivierenbuurt in Utrecht kwamen bijeen voor een wijkoverleg over het geplande nieuwe fietspad langs de Rijnlaan.",en:"Good evening. You are listening to Regional News. Tonight in the programme: residents of the Rivierenbuurt in Utrecht came together for a neighbourhood meeting about the planned new cycle path along the Rijnlaan."},
      {nl:"Het voorstel van de gemeente is om een tweerichtingsfietspad aan te leggen over een lengte van driehonderd meter, waarvoor enkele parkeerplaatsen moeten verdwijnen.",en:"The municipality's proposal is to construct a two-way cycle path over a length of three hundred metres, for which a number of parking spaces would have to be removed."},
      {nl:"Onze verslaggever Joost Kamp was aanwezig bij de bijeenkomst en brengt verslag uit.",en:"Our reporter Joost Kamp was present at the meeting and reports."},
      {nl:"Dank je. De sfeer vanavond was goed te noemen, maar er waren duidelijke meningsverschillen. Een deel van de bewoners reageerde enthousiast op het voorstel. 'Als we nou eens ook gelijk de bomen langs het pad vernieuwen?' stelde één bewoonster voor. Anderen wilden juist weten hoeveel parkeerplaatsen er precies verdwijnen.",en:"Thank you. The atmosphere this evening could be described as good, but there were clear differences of opinion. Some residents responded enthusiastically to the proposal. 'What if we also renew the trees along the path at the same time?' one resident suggested. Others wanted to know exactly how many parking spaces would disappear."},
      {nl:"Hoe reageerde de wethouder op die bezwaren?",en:"How did the alderman respond to those objections?"},
      {nl:"Wethouder De Boer zei dat er maximaal veertien plaatsen verdwijnen, maar dat er elders in de wijk zeventien nieuwe worden aangelegd. 'Ik stel voor dat we de definitieve plannen eerst laten zien op een tweede bijeenkomst', zei ze, 'zodat bewoners concreet kunnen reageren.'",en:"Alderman De Boer said that a maximum of fourteen spaces would disappear, but that seventeen new ones would be created elsewhere in the neighbourhood. 'I suggest we first show the final plans at a second meeting,' she said, 'so that residents can respond concretely.'"},
      {nl:"Waren alle bewoners tevreden met dat antwoord?",en:"Were all residents satisfied with that answer?"},

  reading:{
    title:"Nepnieuws en mediageletterdheid in Nederland",
    paras:[
      "In het digitale tijdperk verspreidt verkeerde informatie zich razendsnel. Een onwaarheidje dat 's ochtends op sociale media wordt geplaatst, kan 's middags al door duizenden mensen zijn doorgestuurd. Nederland staat daarin niet alleen: uit onderzoek van de Europese Commissie blijkt dat meer dan zestig procent van de Europeanen wekelijks in aanraking komt met desinformatie. Maar hoe gaan Nederlanders daarmee om?",
      "Mediageletterdheid — het vermogen om informatie kritisch te beoordelen — staat in Nederland steeds meer op de politieke agenda. Scholen zijn verplicht om leerlingen te leren hoe ze bronnen kunnen controleren. Organisaties zoals Nieuwscheckers en Nu.nl's factcheckrubriek corrigeren openlijk beweringen die in de media circuleren. Toch blijft het moeilijk om bij te houden hoe snel desinformatie zich aanpast.",
      "Een veelgehoord gerucht dat recent de ronde deed, betrof de sluiting van een populaire buurtsuper in Amsterdam. Naar verluidt zou de eigenaar failliet zijn gegaan vanwege huurproblemen. Het bericht werd gedeeld via WhatsApp-groepen en bereikte honderden bewoners voordat iemand het controleerde. De eigenaar, die zogenaamd failliet was, opende die ochtend gewoon zijn winkel. Het gerucht had geen enkel bewijs.",
      "Sociale media versterken het probleem doordat algoritmen sensationele berichten vaker tonen dan genuanceerde informatie. Berichten die emoties oproepen — woede of angst — worden sneller gedeeld dan feitelijke rapporten. Bovendien hechten mensen meer geloof aan informatie die bevestigt wat ze al denken: het zogenaamde bevestigingseffect.",
      "Wat kunnen gewone burgers doen? Ten eerste: controleer wie de bron is voordat je iets deelt. Ten tweede: zoek het bericht op bij een erkend nieuwsmedium. Ten derde: twijfel bij sterke emotionele reacties — die zijn vaak een teken dat je juist kritischer moet kijken. Mediageletterdheid is geen luxe; het is een burgerplicht.",
    ],
    parasEn:[
      "In the digital age, misinformation spreads at lightning speed. A falsehood posted on social media in the morning can already have been forwarded by thousands of people in the afternoon. The Netherlands is not alone in this: research by the European Commission shows that more than sixty percent of Europeans encounter disinformation weekly. But how do Dutch people deal with it?",
      "Media literacy — the ability to critically assess information — is increasingly on the political agenda in the Netherlands. Schools are required to teach pupils how to check sources. Organisations such as Nieuwscheckers and Nu.nl's fact-checking section openly correct claims circulating in the media. Yet it remains difficult to keep up with how quickly disinformation adapts.",
      "A widely heard rumour that recently did the rounds concerned the closure of a popular neighbourhood supermarket in Amsterdam. Reportedly the owner had gone bankrupt due to rental problems. The message was shared via WhatsApp groups and reached hundreds of residents before anyone checked it. The owner, who was supposedly bankrupt, simply opened his shop that morning. The rumour had no evidence whatsoever.",
      "Social media amplifies the problem because algorithms show sensational messages more often than nuanced information. Messages that evoke emotions — anger or fear — are shared faster than factual reports. Moreover, people are more likely to believe information that confirms what they already think: the so-called confirmation effect.",
      "What can ordinary citizens do? First: check who the source is before you share something. Second: look up the message with a recognised news medium. Third: be suspicious of strong emotional reactions — these are often a sign that you should look more critically. Media literacy is not a luxury; it is a civic duty.",
    ],

      {q:"Wat is het 'bevestigingseffect' en hoe draagt het bij aan het probleem?",a:"Mensen geloven eerder informatie die al hun bestaande opvattingen bevestigt, waardoor ze minder kritisch zijn op dergelijke berichten."},
      {q:"Noem de drie stappen die de tekst aanraadt om desinformatie te bestrijden.",a:"1. Controleer de bron. 2. Zoek op bij een erkend nieuwsmedium. 3. Wees kritischer bij sterke emotionele reacties."},

  listening:{
    title:"Nieuwsitem: gerucht over sluiting buurtsuper blijkt vals",
    sents:[
      {nl:"Goed nieuws voor buurtbewoners in de Pijp: de populaire Dirk-supermarkt in de Van Ostadestraat gaat niet sluiten. Dat meldt de eigenaar vandaag in een persverklaring, nadat het bericht over een mogelijke sluiting de afgelopen dagen massaal werd gedeeld via sociale media.",en:"Good news for neighbourhood residents in the Pijp: the popular Dirk supermarket in Van Ostadestraat is not closing. The owner announced this today in a press statement, after the news about a possible closure was shared massively via social media in recent days."},
      {nl:"Onze verslaggever Dana Smit is ter plaatse. Dana, wat is er precies gebeurd?",en:"Our reporter Dana Smit is on location. Dana, what exactly happened?"},
      {nl:"Het begon afgelopen donderdag met een berichtje in een lokale WhatsApp-groep. Daarin stond dat de eigenaar van de supermarkt problemen had met het huurcontract en dat de winkel per 1 oktober zou sluiten. Binnen twee dagen werd het bericht door meer dan drieduizend mensen gedeeld.",en:"It started last Thursday with a message in a local WhatsApp group. It stated that the owner of the supermarket had problems with the rental contract and that the shop would close on 1 October. Within two days the message was shared by more than three thousand people."},
      {nl:"En wat klopt er van dat bericht?",en:"And what is true about that message?"},
      {nl:"Vrijwel niets, zo blijkt nu. De eigenaar, meneer Gerritsen, bevestigde vanmorgen dat er wel gesprekken zijn geweest met de verhuurder over een huurverhoging, maar dat die zijn afgerond. Er is geen sprake van faillissement of sluiting.",en:"Virtually nothing, it now appears. The owner, Mr Gerritsen, confirmed this morning that there had been discussions with the landlord about a rent increase, but that these had been concluded. There is no question of bankruptcy or closure."},
      {nl:"Weet men al wie het bericht als eerste heeft verstuurd?",en:"Do people know yet who sent the message first?"},
      {nl:"Dat is onduidelijk. Het schijnt dat iemand een fragment uit een e-mail had gelezen en dat uit zijn verband had gehaald. Wie dat heeft gedaan en waarom, is nog onbekend.",en:"That is unclear. It seems that someone had read a fragment from an email and taken it out of context. Who did that and why is still unknown."},
      {nl:"Hoe reageren buurtbewoners?",en:"How are neighbourhood residents reacting?"},
      {nl:"Opgelucht, maar ook kritisch. Meerdere bewoners zeiden dat ze het bericht hadden doorgestuurd zonder het te controleren. 'Ik had het eerst moeten natrekken,' zei één bewoner. 'Maar het klonk zo overtuigend.'",en:"Relieved, but also self-critical. Several residents said they had forwarded the message without checking it. 'I should have checked it first,' said one resident. 'But it sounded so convincing.'"},
      {nl:"Wat zegt de eigenaar over de schade die het gerucht heeft aangericht?",en:"What does the owner say about the damage caused by the rumour?"},
      {nl:"Meneer Gerritsen zegt dat hij de afgelopen dagen honderden telefoontjes heeft ontvangen van bezorgde klanten. 'Het heeft ook echt invloed gehad op de omzet', zegt hij. 'Mensen kochten minder omdat ze dachten dat we toch zouden sluiten.'",en:"Mr Gerritsen says he has received hundreds of phone calls from worried customers in recent days. 'It really did affect turnover,' he says. 'People bought less because they thought we were going to close anyway.'"},
      {nl:"Dank je, Dana. Dit incident onderstreept opnieuw hoe snel een ongecontroleerd bericht schade kan aanrichten. Controleer altijd de bron voordat u iets deelt.",en:"Thank you, Dana. This incident once again underlines how quickly an unchecked message can cause damage. Always check the source before you share something."},

  reading:{
    title:"Hybride werken: vrijheid of versnippering?",
    paras:[
      "Sinds de coronapandemie is hybride werken — een combinatie van thuiswerken en werken op kantoor — de norm geworden voor veel Nederlandse kenniswerkers. Bedrijven experimenteerden noodgedwongen met afstandswerk en ontdekten dat de productiviteit in veel gevallen niet daalde. Nu, enkele jaren later, is de discussie verschoven: niet meer óf hybride werken mag, maar hoe het het beste kan worden georganiseerd.",
      "Voorstanders van hybride werken wijzen op de voordelen die ze zelf ervaren. Ten eerste besparen werknemers reistijd, wat gemiddeld bijna een uur per dag scheelt. Ten tweede heeft thuiswerken een positief effect op de werk-privébalans: mensen kunnen beter hun eigen ritme bewaren en zijn minder snel overprikkeld. Ten derde tonen meerdere onderzoeken aan dat geconcentreerd werk, zoals het schrijven van rapporten of het analyseren van data, thuis effectiever verloopt dan op een open kantoorvloer.",
      "Tegenstanders wijzen op de keerzijde. Sociale cohesie binnen teams staat onder druk als medewerkers elkaar nauwelijks nog fysiek ontmoeten. Nieuwe medewerkers lopen kennis en informele netwerken mis die je normaal gesproken opdoet door simpelweg in de buurt van collega's te zijn. Bovendien is de grens tussen werk en privé voor sommige mensen vervaagd: ze werken langer dan gezond is, omdat ze het gevoel hebben 'toch thuis te zitten'.",
      "Er is ook een ongelijkheidsaspect. Hybride werken is een voorrecht dat niet voor iedereen weggelegd is. Verpleegkundigen, buschauffeurs, kassamedewerkers — voor hen is thuiswerken geen optie. Critici vragen zich af of de discussie over hybride werken daardoor een elitediscussie is geworden, die voorbijgaat aan de meerderheid van de beroepsbevolking.",
      "Uiteindelijk zijn bedrijven bezig met het zoeken naar een evenwicht. Sommige hanteren een minimum van twee kantoor-dagen per week; anderen laten het volledig aan de werknemer over. Wat zeker is: de tijden dat iedereen elke dag van negen tot vijf op kantoor moest zitten, komen niet meer terug. De keuze hoe hybride werken in te richten, is daarmee een van de centrale arbeidsmarktdebatten van dit decennium.",
    ],
    parasEn:[
      "Since the COVID-19 pandemic, hybrid working — a combination of working from home and working at the office — has become the norm for many Dutch knowledge workers. Companies experimented with remote work by necessity and found that productivity in many cases did not decline. Now, several years later, the discussion has shifted: no longer whether hybrid working is allowed, but how it can best be organised.",
      "Advocates of hybrid working point to benefits they experience themselves. First, employees save commuting time, which averages nearly an hour a day. Second, working from home has a positive effect on work-life balance: people can better maintain their own rhythm and are less quickly overstimulated. Third, several studies show that focused work, such as writing reports or analysing data, is more effective at home than on an open-plan office floor.",
      "Opponents point to the other side. Social cohesion within teams is under pressure when employees rarely meet each other physically. New employees miss knowledge and informal networks that you normally pick up simply by being near colleagues. Moreover, the boundary between work and private life has blurred for some people: they work longer than is healthy, because they feel they are 'sitting at home anyway'.",
      "There is also an inequality aspect. Hybrid working is a privilege not available to everyone. Nurses, bus drivers, checkout staff — for them, working from home is not an option. Critics wonder whether the discussion about hybrid working has therefore become an elite discussion that passes over the majority of the working population.",
      "Ultimately, companies are searching for a balance. Some require a minimum of two office days per week; others leave it entirely to the employee. What is certain: the days when everyone had to sit in the office nine to five every day are not coming back. The choice of how to organise hybrid working has therefore become one of the central labour market debates of this decade.",

  listening:{
    title:"Radiodebat: twee baanaanbiedingen, één moeilijke keus",
    sents:[
      {nl:"Goedemorgen en welkom bij De Ochtendshow. Vandaag bespreken we een dilemma dat veel luisteraars kennen: je krijgt twee baanaanbiedingen tegelijk. Onze gast Yasmine Oubali staat voor precies die situatie. Yasmine, vertel.",en:"Good morning and welcome to The Morning Show. Today we discuss a dilemma that many listeners know: you receive two job offers at the same time. Our guest Yasmine Oubali faces exactly that situation. Yasmine, tell us."},
      {nl:"Ja, het is een luxeprobleem, maar toch. Het eerste aanbod is bij een groot internationaal technologiebedrijf in Amsterdam. Uitdagend werk, een salaris dat dertig procent hoger is dan wat ik nu verdien, en goede doorgroeimogelijkheden. Maar ik moet er vijf dagen per week naartoe — geen hybride optie.",en:"Yes, it is a luxury problem, but still. The first offer is at a large international technology company in Amsterdam. Challenging work, a salary that is thirty percent higher than what I earn now, and good career progression. But I have to go there five days a week — no hybrid option."},
      {nl:"En het tweede aanbod?",en:"And the second offer?"},
      {nl:"Een kleinere organisatie, dicht bij huis. Minder salaris, maar volledig hybride werken, een heel fijn team — zo lijkt het — en ik ben ervan overtuigd dat ik er inhoudelijk net zo veel kan leren.",en:"A smaller organisation, close to home. Less salary, but fully hybrid working, a very nice team — it seems — and I am convinced I can learn just as much there in terms of content."},
      {nl:"Ik merk dat u al een beetje neigt naar het tweede. Maar is het salarisverschil niet doorslaggevend?",en:"I notice you are already leaning slightly towards the second. But isn't the salary difference decisive?"},
      {nl:"Dat vraag ik me ook af. Ik heb erover nagedacht: als ik het nettoverschil bereken en de reiskosten en tijdsinvestering eraf trek, blijft er minder over dan het lijkt. Vijf dagen per week reizen kost me ruim twee uur per dag.",en:"I wonder that too. I've thought about it: when I calculate the net difference and subtract travel costs and time investment, less remains than it seems. Commuting five days a week costs me over two hours a day."},
      {nl:"Dat is inderdaad een concrete manier om het af te wegen. Zijn er nog andere factoren?",en:"That is indeed a concrete way to weigh it up. Are there any other factors?"},
      {nl:"Mijn gezin. Ik heb twee jonge kinderen. Daarvoor is die extra reistijd echt een nadeel. Maar anderzijds — ik heb er geen spijt van willen hebben dat ik de uitdaging niet heb aangedurfd.",en:"My family. I have two young children. For that, the extra commute is a real disadvantage. But on the other hand — I don't want to regret not having dared to take on the challenge."},
      {nl:"Wat zegt uw partner ervan?",en:"What does your partner say?"},
      {nl:"Mijn partner zegt: kies voor jezelf, niet voor het cv. Maar ik vind het moeilijk om dat advies op te volgen als het ook financieel impact heeft op ons gezin.",en:"My partner says: choose for yourself, not for your CV. But I find it difficult to follow that advice when it also has a financial impact on our family."},
      {nl:"U heeft tot vrijdag om te beslissen. Wat gaat u doen?",en:"You have until Friday to decide. What are you going to do?"},
      {nl:"Ik ga dit weekend een pro-en-contralijst maken met mijn partner. En dan beslis ik. Want eraan blijven twijfelen helpt niemand — ook mezelf niet.",en:"I am going to make a pros-and-cons list with my partner this weekend. And then I will decide. Because continuing to doubt helps no one — not even myself."},
    ]

  reading:{
    title:"Nederlandse directheid: mythe of realiteit?",
    paras:[
      "Weinig nationale eigenschappen worden zo consequent aan Nederlanders toegeschreven als directheid. In internationale ranglijsten voor communicatiestijlen staat Nederland standaard hoog: Nederlanders zeggen wat ze denken, geven ongewraagd hun mening en ervaren omzichtigheid al snel als onoprecht. Maar is dit beeld accurate, of gaat het om een hardnekkig stereotype dat de werkelijkheid versimpelt?",
      "Socioloog Geert Hofstede onderzocht decennia lang culturele verschillen tussen landen. Zijn model plaatst Nederland in de categorie 'individualistische' en 'lage-machtsafstandsculturen': mensen spreken collega's en leidinggevenden relatief makkelijk aan, ongeacht hiërarchie. Dat draagt bij aan de reputatie van directheid. Toch nuanceren andere onderzoekers dit beeld. Ze wijzen erop dat Nederlanders weliswaar direct zijn in hun oordelen, maar tegelijk ook sterk gericht op consensus — het poldermodel — wat juist vraagt om geduld en diplomatiek overleg.",
      "Bovendien zijn er aanzienlijke regionale en generatieverschillen. Mensen uit Amsterdam communiceren anders dan mensen uit Brabant of Friesland. En jongeren gebruiken steeds meer indirecte taal online, waarbij ironie en understatement de norm zijn. De 'directe Nederlander' is dus deels een abstractie die voorbijgaat aan de rijkdom van regionale gewoontes.",
      "Interessant is ook hoe Nederlanders zelf omgaan met stereotypen over zichzelf. Ze kunnen er zelf om lachen — 'een typisch Nederlandse eigenschap is dat we geen typische eigenschappen hebben' — maar reageren soms ook defensief als buitenlanders hun cultuur te eenzijdig beschrijven. Dat duidt erop dat nationale identiteit een gevoelig onderwerp blijft, ook voor mensen die beweren er nuchter tegenover te staan.",
      "De conclusie is dat directheid in Nederland wel degelijk een culturele waarde is, maar dat ze niet los gezien kan worden van context, regio, generatie en situatie. Stereotypen bieden een nuttig startpunt voor begrip, maar wie echt wil communiceren met Nederlanders, doet er verstandig aan om individuen als individuen te benaderen — en niet als representanten van een collectief karakterschets.",
    ],
    parasEn:[
      "Few national characteristics are as consistently attributed to Dutch people as directness. In international rankings for communication styles, the Netherlands consistently scores high: the Dutch say what they think, give their opinion unsolicited and quickly experience circumspection as insincere. But is this picture accurate, or is it a persistent stereotype that oversimplifies reality?",
      "Sociologist Geert Hofstede researched cultural differences between countries for decades. His model places the Netherlands in the category of 'individualistic' and 'low power distance cultures': people address colleagues and managers relatively easily, regardless of hierarchy. This contributes to the reputation for directness. Yet other researchers nuance this picture. They point out that while the Dutch are direct in their judgements, they are simultaneously strongly focused on consensus — the polder model — which actually requires patience and diplomatic consultation.",
      "Moreover, there are considerable regional and generational differences. People from Amsterdam communicate differently from people in Brabant or Friesland. And young people increasingly use indirect language online, where irony and understatement are the norm. The 'direct Dutchman' is therefore partly an abstraction that overlooks the richness of regional customs.",
      "It is also interesting how the Dutch themselves deal with stereotypes about themselves. They can laugh about it — 'a typical Dutch characteristic is that we have no typical characteristics' — but sometimes react defensively when foreigners describe their culture too one-sidedly. This suggests that national identity remains a sensitive topic, even for people who claim to take a sober view of it.",
      "The conclusion is that directness in the Netherlands is certainly a cultural value, but that it cannot be seen in isolation from context, region, generation and situation. Stereotypes offer a useful starting point for understanding, but whoever really wants to communicate with Dutch people would be wise to approach individuals as individuals — and not as representatives of a collective character sketch.",
    ],

  listening:{

    sents:[
      {nl:"Nederland staat wereldwijd bekend als fietsland bij uitstek. Maar nieuwe cijfers van het CBS laten zien dat het aantal fietskilometers per persoon de afgelopen vijf jaar licht is gedaald. Hoe valt dat te verklaren?",en:"The Netherlands is world-famous as a cycling nation par excellence. But new figures from Statistics Netherlands show that the number of kilometres cycled per person has fallen slightly over the past five years. How can that be explained?"},
      {nl:"Onze verslaggever Lotte van Dam zocht het uit.",en:"Our reporter Lotte van Dam investigated."},
      {nl:"Dank je. Ik sprak met verkeersonderzoeker dr. Pieter Janssen van de TU Delft. Hij wijst op een aantal factoren. Ten eerste heeft de opkomst van de e-bike het rijgedrag veranderd: mensen fietsen weliswaar vaker, maar leggen kortere afstanden af per rit.",en:"Thank you. I spoke with traffic researcher Dr Pieter Janssen from TU Delft. He points to a number of factors. First, the rise of the e-bike has changed riding behaviour: people cycle more often, but cover shorter distances per trip."},
      {nl:"Is de e-bike dan een probleem?",en:"Is the e-bike a problem then?"},
      {nl:"Niet per se. Dr. Janssen benadrukt dat de e-bike juist ouderen en mensen met een lichamelijke beperking meer mobiliteit geeft. Maar voor de totale fietskilometers per persoon heeft het wel degelijk een negatief effect.",en:"Not necessarily. Dr Janssen emphasises that the e-bike actually gives elderly people and those with physical disabilities more mobility. But for total cycling kilometres per person, it does have a negative effect."},
      {nl:"En wat zijn de andere factoren?",en:"And what are the other factors?"},
      {nl:"Ten tweede is er de opkomst van bezorgdiensten. Vroeger fietsten mensen naar de winkel; nu bestellen ze online. En ten derde: het thuiswerken. Wie niet meer naar kantoor hoeft, fietst ook niet meer die dagelijkse woon-werkafstand.",en:"Second, there is the rise of delivery services. People used to cycle to the shop; now they order online. And third: working from home. Whoever no longer needs to go to the office also no longer cycles that daily commute."},
      {nl:"Zijn er ook positieve ontwikkelingen?",en:"Are there also positive developments?"},
      {nl:"Zeker. Het recreatief fietsen is toegenomen, vooral in het weekend. Nederlanders fietsen eigenlijk meer voor plezier dan vroeger, maar minder uit noodzaak. Dat zegt ook iets over hoe de gewoonte aan het verschuiven is.",en:"Certainly. Recreational cycling has increased, especially at weekends. Dutch people actually cycle more for pleasure than before, but less out of necessity. That also says something about how the habit is shifting."},
      {nl:"Wat moet er volgens de onderzoekers gebeuren om het functioneel fietsen te stimuleren?",en:"What do researchers say needs to happen to encourage functional cycling?"},
      {nl:"Betere fietsinfrastructuur, veilige stallingen bij treinstations en bewustwordingscampagnes. Maar ook: werkgevers die fietsvergoedingen aantrekkelijker maken. Want zoals dr. Janssen zei: 'Een gewoonte verandert niet vanzelf. Daar heb je beleid voor nodig.'",en:"Better cycling infrastructure, secure storage at train stations and awareness campaigns. But also: employers making cycling allowances more attractive. Because as Dr Janssen said: 'A habit does not change by itself. You need policy for that.'"},

    title:"Vergaderen in Nederland: van polderoverleg tot actielijst",
    paras:[
      "In Nederland wordt veel vergaderd. Heel veel. Onderzoek van McKinsey schat dat Nederlandse kenniswerkers gemiddeld een derde van hun werktijd in vergaderingen doorbrengen. Dat is internationaal gezien relatief hoog, maar past wel bij de Nederlandse bestuurscultuur: beslissingen worden bij voorkeur genomen op basis van consensus, niet van hiërarchie. Het gevolg is dat overleg vaak lang duurt — en niet altijd leidt tot concrete uitkomsten.",
      "Een typische Nederlandse vergadering begint met een agenda die vooraf wordt rondgestuurd. Ten eerste worden de actiepunten van de vorige vergadering besproken: zijn de taken uitgevoerd? Vervolgens komen de nieuwe agendapunten aan bod. Iedereen krijgt de gelegenheid zijn mening te geven, ook al duurt dat langer. Ten slotte worden de conclusies vastgelegd in een notulen — een schriftelijke samenvatting van wat besproken en besloten is.",
      "De notulen zijn een cruciale stap. Ze beschrijven de kernpunten van de discussie, de genomen besluiten en de actiepunten: wie doet wat, vóór wanneer? In professionele omgevingen worden notulen vaak door een aangewezen notulist geschreven tijdens de vergadering zelf. Bovendien dienen ze als officieel bewijs van wat is afgesproken — een kwestie die bij conflicten of misverstanden relevant kan zijn.",

    parasEn:[
      "In the Netherlands, there are many meetings. Very many. Research by McKinsey estimates that Dutch knowledge workers spend on average a third of their working time in meetings. That is relatively high by international standards, but fits with Dutch governance culture: decisions are preferably made on the basis of consensus, not hierarchy. The result is that deliberations often take a long time — and do not always lead to concrete outcomes.",
      "A typical Dutch meeting begins with an agenda that is circulated in advance. First, the action points from the previous meeting are discussed: have the tasks been completed? Then the new agenda items are addressed. Everyone gets the opportunity to give their opinion, even if that takes longer. Finally, the conclusions are recorded in the minutes — a written summary of what was discussed and decided.",
      "The minutes are a crucial step. They describe the key points of the discussion, the decisions taken and the action points: who does what, by when? In professional environments, minutes are often written by a designated secretary during the meeting itself. Moreover, they serve as official proof of what was agreed — a matter that can be relevant in case of conflicts or misunderstandings.",
      "Critics of the meeting culture point out that the polder model has its downside. Because everyone is allowed to have a say, it sometimes takes too long to reach a decision. In fast-changing sectors, such as technology, that can be a disadvantage. Moreover, not all meetings are run equally well: an ineffective meeting without a clear structure wastes time and frustrates participants.",
      "Yet Dutch meeting culture also has advantages that are valued abroad. Decisions taken collectively are better embraced by the group and encounter less resistance during implementation. In short: the Dutch consultation model is slow, but sustainable. All in all, it reflects a society that values agreement over speed.",

const knownSets   = {}; // keyed by chapter id

function getKnown(chId){
  if(!knownSets[chId]){
    const stored = localStorage.getItem("known_"+chId);
    knownSets[chId] = stored ? new Set(JSON.parse(stored)) : new Set();
  }
  return knownSets[chId];
}
function saveKnown(chId){ localStorage.setItem("known_"+chId, JSON.stringify([...getKnown(chId)])); }

function currentChapter(){ return CHAPTERS[currentChIdx]; }

// TTS — start / pause+continue / hard stop
// ════════════════════════════════════════════════════════════════════
let dutchVoice = null;
const tts = { queue:[], idx:0, rate:1.0, paused:false, active:false, hardStop:false };

function loadVoices(){
  const voices = speechSynthesis.getVoices();
  dutchVoice = voices.find(v=>/^nl-NL/i.test(v.lang) && /nederland|dutch/i.test(v.name))
    || voices.find(v=>/^nl-NL/i.test(v.lang))
    || voices.find(v=>/^nl/i.test(v.lang))
    || null;
}
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function refreshTtsButtons(){
  document.querySelectorAll("[data-tts-toggle]").forEach(btn=>{
    if(tts.paused) btn.textContent = "▶ Continue";
    else if(tts.active || (window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending))) btn.textContent = "⏸ Pause";
    else btn.textContent = "■ Stop";
  });
}

function speakQueue(texts, rate=1.0){
  if(!window.speechSynthesis){ alert("Speech synthesis not available in this browser."); return; }
  tts.hardStop = true;
  speechSynthesis.cancel();
  tts.hardStop = false;
  tts.queue = (Array.isArray(texts) ? texts : [texts]).map(t=>String(t||"").trim()).filter(Boolean);
  tts.idx = 0;
  tts.rate = rate;
  tts.paused = false;
  tts.active = tts.queue.length > 0;
  refreshTtsButtons();
  playNextUtterance();
}

function speak(text, rate=1.0){ speakQueue([text], rate); }

function playNextUtterance(){
  if(!window.speechSynthesis || tts.hardStop || tts.paused) return;
  if(tts.idx >= tts.queue.length){
    tts.active = false;
    refreshTtsButtons();
    return;
  }
  const u = new SpeechSynthesisUtterance(tts.queue[tts.idx]);
  u.lang = "nl-NL";
  u.rate = tts.rate;
  if(dutchVoice) u.voice = dutchVoice;
  u.onend = ()=>{
    if(tts.hardStop || tts.paused) return;
    tts.idx++;
    setTimeout(playNextUtterance, 350);
  };
  u.onerror = ()=>{
    if(tts.hardStop) return;
    tts.idx++;
    setTimeout(playNextUtterance, 200);
  };
  speechSynthesis.speak(u);
  tts.active = true;
  refreshTtsButtons();
}

/** Pause while playing, or continue from pause. */
function togglePauseContinue(){
  if(!window.speechSynthesis) return;
  if(tts.paused || speechSynthesis.paused){
    tts.paused = false;
    if(speechSynthesis.paused) speechSynthesis.resume();
    else if(tts.active && tts.idx < tts.queue.length && !speechSynthesis.speaking) playNextUtterance();
    refreshTtsButtons();
    return;
  }
  if(speechSynthesis.speaking || speechSynthesis.pending || tts.active){
    try{ speechSynthesis.pause(); }catch(e){}
    tts.paused = true;
    refreshTtsButtons();
  }
}

function stopTTS(){
  if(!window.speechSynthesis) return;
  tts.hardStop = true;
  tts.paused = false;
  tts.active = false;
  tts.queue = [];
  tts.idx = 0;
  speechSynthesis.cancel();
  tts.hardStop = false;
  refreshTtsButtons();
}

function buildChTabs(){
  const el = document.getElementById("chTabs");
  CHAPTERS.forEach((ch,i)=>{
    const b=document.createElement("button");
    b.className="ch-tab"+(i===0?" active":"");
    b.textContent="H"+ch.id;
    b.title=ch.title;
    b.onclick=()=>selectChapter(i);
    el.appendChild(b);
  });
}

function selectChapter(idx){
  if(testRun.active && CHAPTERS[idx].id !== testRun.chId){
    if(!confirm("A 30-min test is running. Switch chapter and abort the test?")) return;
    stopTestTimer();
    testRun.active=false;
    testRun.finished=false;
  }
  currentChIdx=idx;
  document.querySelectorAll(".ch-tab").forEach((b,i)=>b.classList.toggle("active",i===idx));
  buildHeader();
  resetVocabDeck();
  renderCurrentModule();
}

function buildHeader(){
  const ch=currentChapter();
  document.getElementById("chEyebrow").textContent="Hoofdstuk "+ch.id+" / 8";
  document.getElementById("chTitle").textContent=ch.title;
  document.getElementById("chFocus").textContent=ch.focus;
}

  else if(currentMod==="grammar"){ renderGrammar(); }
  else if(currentMod==="reading"){ renderReading(); }

}
