// VOCAB
// ════════════════════════════════════════════════════════════════════
function resetVocabDeck(){
  const ch=currentChapter();
  vcDeck=[...ch.vocab.map((v,i)=>({...v,origIdx:i}))];
  vcPos=0; vcFlipped=false; vcShowUnknown=false;
  if(currentMod==="vocab") updateVocabUI();
}

function shuffleDeck(){
  for(let i=vcDeck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vcDeck[i],vcDeck[j]]=[vcDeck[j],vcDeck[i]];}
  vcPos=0; vcFlipped=false; updateVocabUI();
}

function filterUnknown(){
  const ch=currentChapter();
  const known=getKnown(ch.id);
  vcShowUnknown=true;
  vcDeck=ch.vocab.map((v,i)=>({...v,origIdx:i})).filter(v=>!known.has(v.nl));
  if(!vcDeck.length){ vcDeck=[...ch.vocab.map((v,i)=>({...v,origIdx:i}))]; alert("All words are marked as known! Great job!"); }
  vcPos=0; vcFlipped=false; updateVocabUI();
}

function updateVocabUI(){
  const ch=currentChapter();
  const known=getKnown(ch.id);
  if(!vcDeck.length || vcDeck[0].origIdx===undefined) resetVocabDeck();

  const total=vcDeck.length;
  const knownCount=vcDeck.filter(v=>known.has(v.nl)).length;

  document.getElementById("vcTotal").textContent=total;
  document.getElementById("vcKnownCount").textContent=knownCount;
  document.getElementById("vcPos").textContent=vcPos+1;
  document.getElementById("vcFill").style.width=(knownCount/total*100)+"%";

  // progress dots
  const dots=document.getElementById("progDots");
  dots.innerHTML="";
  vcDeck.forEach((v,i)=>{
    const d=document.createElement("span");
    d.className="prog-dot"+(i===vcPos?" active":known.has(v.nl)?" known":"");
    dots.appendChild(d);
  });

  const v=vcDeck[vcPos]||vcDeck[0];
  document.getElementById("fcNl").textContent=v.nl;
  document.getElementById("fcEn").textContent=v.en;
  document.getElementById("fcEx").textContent=v.ex;
  document.getElementById("fcExEn").textContent=v.exEn;
  const cat=v.nl.startsWith("de ")||v.nl.startsWith("het ")?"noun":v.nl.includes(" ")&&!v.nl.startsWith("de ")&&!v.nl.startsWith("het ")?"phrase":"verb/adj";
  document.getElementById("fcCat").textContent=cat;

  const fc=document.getElementById("flashcard");
  if(vcFlipped) fc.classList.add("flipped");
  else fc.classList.remove("flipped");
}

function flipCard(){ vcFlipped=!vcFlipped; updateVocabUI(); }

function vcNav(dir){
  vcFlipped=false;
  vcPos=(vcPos+dir+vcDeck.length)%vcDeck.length;
  updateVocabUI();
}

function markKnown(){
  const ch=currentChapter();
  const v=vcDeck[vcPos];
  if(v){ getKnown(ch.id).add(v.nl); saveKnown(ch.id); }
  vcFlipped=false;
  vcPos=Math.min(vcPos+1,vcDeck.length-1);
  updateVocabUI();
}

function markUnknown(){
  const ch=currentChapter();
  const v=vcDeck[vcPos];
  if(v){ getKnown(ch.id).delete(v.nl); saveKnown(ch.id); }
  vcFlipped=false;
  vcPos=Math.min(vcPos+1,vcDeck.length-1);
  updateVocabUI();
}

function speakCurrentWord(){
  const v=vcDeck[vcPos];
  if(v) speak(v.nl, 0.85);
}
function speakExample(){
  const v=vcDeck[vcPos];
  if(v) speak(v.ex, 0.9);
}

// vocab controls wiring
document.getElementById("vcShuffle").onclick=shuffleDeck;
document.getElementById("vcUnknown").onclick=filterUnknown;
document.getElementById("vcAll").onclick=resetVocabDeck;
document.getElementById("vcReset").onclick=()=>{
  const ch=currentChapter();
  getKnown(ch.id).clear(); saveKnown(ch.id); updateVocabUI();
};

// GRAMMAR
// ════════════════════════════════════════════════════════════════════
function renderGrammar(){
  const ch=currentChapter();
  const {points,exercises}=ch.grammar;
  let html="";
  points.forEach(p=>{
    html+=`<div class="card rule-card">
      <div class="rule-title"><span class="rule-badge">${p.badge}</span> ${p.title}</div>
      <p style="font-size:.93rem;margin-bottom:.5rem">${p.explanation}</p>`;
    if(p.pattern) html+=`<div class="pattern-box">${p.pattern.replace(/\n/g,"<br/>")}</div>`;
    html+=`<table class="ex-table">`;
    p.examples.forEach(ex=>{
      html+=`<tr>
        <td onclick="speak(this.textContent.replace(/<[^>]+>/g,'').replace(/^[^:]+: /,''),0.9)" style="cursor:pointer" title="Click to hear">🔊 ${ex.nl}</td>
        <td>${ex.en}</td>
      </tr>`;
    });
    html+=`</table></div>`;
  });

  exercises.forEach(ex=>{
    html+=`<div class="exercise" id="ex_${ex.id}">
      <h4>${ex.instruction}</h4>`;
    ex.items.forEach((item,idx)=>{
      html+=`<div class="ex-item">
        <div class="stem">${idx+1}. ${item.stem}</div>
        <div>`;
      item.options.forEach((opt,oi)=>{
        html+=`<button class="option-btn" data-exid="${ex.id}" data-idx="${idx}" data-opt="${oi}" data-correct="${oi===item.answer}" onclick="checkOpt(this)">${opt}</button>`;
      });
      html+=`</div></div>`;
    });
    html+=`</div>`;
  });

  document.getElementById("grammarContent").innerHTML=html;
}

function checkOpt(btn){
  const exid=btn.dataset.exid;
  const idx=btn.dataset.idx;
  // disable all options for this item
  document.querySelectorAll(`[data-exid="${exid}"][data-idx="${idx}"]`).forEach(b=>{
    b.disabled=true;
    if(b.dataset.correct==="true") b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
  });
}

function renderSpeaking(){
  const ch=currentChapter();
  const extra=(TESTS[ch.id]&&TESTS[ch.id].speaking)||[];
  const prompts=[...ch.speaking.prompts, ...extra];
  let html="";
  prompts.forEach((p,idx)=>{
    const pid="sp_"+idx;
    html+=`<div class="card">
      <div style="display:flex;gap:.5rem;align-items:center;margin-bottom:.55rem;flex-wrap:wrap">
        <span class="rule-badge">${esc(p.type)}</span>
        <strong style="font-family:Fraunces,serif;font-size:1.05rem">${esc(p.title)}</strong>
      </div>
      <div class="speak-prompt-box">
        ${esc(p.prompt)}
        <div class="speak-prompt-en">${esc(p.promptEn)}</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-sm" onclick="speak(${esc(JSON.stringify(p.prompt))},0.88)">▶ Start audio</button>
        <button class="btn btn-sm" data-tts-toggle onclick="togglePauseContinue()">■ Stop</button>
        <button class="btn btn-sm btn-sea" id="recBtn_${idx}" onclick="toggleRec(${idx})">🎤 Record myself</button>
        <button class="btn btn-sm" id="playRecBtn_${idx}" onclick="playRecording(${idx})" disabled>▶ Listen recording</button>
      </div>
      <div class="rec-result" id="recResult_${idx}">Press 🎤 to record, then ▶ Listen recording to hear yourself.</div>
      <audio id="recAudio_${idx}" class="rec-audio" controls></audio>
      <div style="margin:.6rem 0 .4rem;font-size:.85rem;font-weight:700;color:var(--muted)">Useful phrases — click to hear:</div>
      <div class="useful-phrases">`;
    (p.phrases||[]).forEach(ph=>{
      html+=`<span class="phrase-chip" onclick="speak(${esc(JSON.stringify(ph))},0.88)">${esc(ph)}</span>`;
    });
    html+=`</div>
      <div class="sample-answer">
        <button class="btn btn-sm" onclick="toggleSample('${pid}')">Show sample answer</button>
        <button class="btn btn-sm" onclick="speak(${esc(JSON.stringify(p.sampleNl))},0.9)">▶ Read sample</button>
        <div id="${pid}_sample" style="display:none;margin-top:.7rem">
          <div class="sample-nl">${esc(p.sampleNl)}</div>
          <div class="sample-en">${esc(p.sampleEn)}</div>
        </div>
      </div>
    </div>`;
  });
  document.getElementById("speakingContent").innerHTML=html;

  window.toggleSample=function(id){
    const el=document.getElementById(id+"_sample");
    el.style.display=el.style.display==="none"?"block":"none";
  };

  window.toggleRec=async function(idx){
    const btn=document.getElementById("recBtn_"+idx);
    const result=document.getElementById("recResult_"+idx);
    const playBtn=document.getElementById("playRecBtn_"+idx);
    const audioEl=document.getElementById("recAudio_"+idx);
    const st=recState[idx];

    if(st && st.recorder && st.recorder.state==="recording"){
      st.recorder.stop();
      if(st.recog){ try{ st.recog.stop(); }catch(e){} }
      btn.classList.remove("listening");
      btn.textContent="🎤 Record myself";
      return;
    }

    // stop any other active recording
    Object.keys(recState).forEach(k=>{
      const other=recState[k];
      if(other && other.recorder && other.recorder.state==="recording"){
        try{ other.recorder.stop(); }catch(e){}
        if(other.recog){ try{ other.recog.stop(); }catch(e){} }
      }
      const ob=document.getElementById("recBtn_"+k);
      if(ob){ ob.classList.remove("listening"); ob.textContent="🎤 Record myself"; }
    });

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      result.textContent="Recording needs a modern browser (Chrome/Edge) over http://localhost or https.";
      return;
    }

    try{
      stopTTS();
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const chunks=[];
      const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
        : (MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "");
      const recorder = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
      recState[idx]={ recorder, chunks, stream, url: st?.url || null, recog:null };

      recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop=()=>{
        stream.getTracks().forEach(t=>t.stop());
        if(chunks.length){
          if(recState[idx].url) URL.revokeObjectURL(recState[idx].url);
          const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
          const url=URL.createObjectURL(blob);
          recState[idx].url=url;
          audioEl.src=url;
          audioEl.classList.add("show");
          playBtn.disabled=false;
          const transcript=result.dataset.transcript||"";
          result.textContent = transcript
            ? ("Saved. Transcript: "+transcript+" — press ▶ Listen recording")
            : "Recording saved — press ▶ Listen recording to hear yourself.";
        } else {
          result.textContent="No audio captured. Try again and allow the microphone.";
        }
        btn.classList.remove("listening");
        btn.textContent="🎤 Record myself";
      };

      recorder.start();
      btn.classList.add("listening");
      btn.textContent="⏹ Stop recording";
      result.dataset.transcript="";
      result.textContent="🎙 Recording… speak Dutch now";

      // Optional live transcript (Chrome)
      const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(SpeechRecognition){
        const recog=new SpeechRecognition();
        recog.lang="nl-NL";
        recog.continuous=true;
        recog.interimResults=true;
        recog.onresult=e=>{
          let txt="";
          for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript+" ";
          txt=txt.trim();
          result.dataset.transcript=txt;
          result.textContent="🎙 "+txt;
        };
        try{ recog.start(); recState[idx].recog=recog; }catch(e){}
      }
    }catch(err){
      result.textContent="Microphone blocked. Allow mic access, or open via http://localhost (not a raw file:// page).";
    }
  };

  window.playRecording=function(idx){
    const audioEl=document.getElementById("recAudio_"+idx);
    const result=document.getElementById("recResult_"+idx);
    const playBtn=document.getElementById("playRecBtn_"+idx);
    if(!audioEl || !audioEl.src){
      result.textContent="No recording yet — press 🎤 Record myself first.";
      return;
    }
    stopTTS();
    if(!audioEl.paused && !audioEl.ended){
      audioEl.pause();
      playBtn.textContent="▶ Listen recording";
      return;
    }
    audioEl.currentTime=0;
    audioEl.play().then(()=>{
      playBtn.textContent="⏸ Pause recording";
    }).catch(()=>{
      result.textContent="Could not play recording. Try recording again.";
    });
    audioEl.onended=()=>{ playBtn.textContent="▶ Listen recording"; };
  };
}

// MATERIALS (server hybrid + local file picker)
// ════════════════════════════════════════════════════════════════════
function materialsStatus(){
  if(materials.mode==="server"){
    const n=materials.audio.reduce((s,a)=>s+a.count,0);
    return "PC server · "+n+" tracks";
  }
  if(materials.mode==="local"){
    const n=materials.audio.reduce((s,a)=>s+a.count,0);
    return n ? ("Local files · "+n+" tracks") : "Local files loaded";
  }
  return "No CD audio yet";
}

function totalTracks(){
  return materials.audio.reduce((s,a)=>s+(a.count||a.tracks.length),0);
}

async function connectMaterials(){
  wireFilePickers();
  try{
    const r=await fetch("/api/index",{cache:"no-store"});
    if(!r.ok) throw new Error("no server");
    const idx=await r.json();
    if(idx && idx.audio && idx.audio.length){
      materials={
        mode:"server",
        exists:!!idx.exists,
        audio: idx.audio.map(a=>({
          folder:a.folder,
          count:a.count,
          tracks:a.tracks.map(t=>({
            name:t,
            url:"/materials/"+encodeURIComponent(a.folder)+"/"+encodeURIComponent(t)
          }))
        }))
      };
    }
  }catch(e){
    if(materials.mode==="none") materials={mode:"none", audio:[], exists:false};
  }
  if(currentMod==="lab"||currentMod==="listening"||currentMod==="test") renderCurrentModule();
}

function wireFilePickers(){
  if(window._pickersWired) return;
  window._pickersWired=true;
  const files=document.getElementById("pickAudioFiles");
  const dir=document.getElementById("pickAudioDir");
  if(files) files.addEventListener("change",()=>ingestAudioFiles(files.files||[]));
  if(dir) dir.addEventListener("change",()=>ingestAudioFiles(dir.files||[]));
}

function ingestAudioFiles(fileList){
  const files=[...fileList].filter(f=>/\.mp3$/i.test(f.name)||(f.type||"").startsWith("audio/"));
  if(!files.length) return;
  labBlobUrls.forEach(u=>URL.revokeObjectURL(u));
  labBlobUrls=[];
  const byFolder={};
  files.forEach(f=>{
    const parts=(f.webkitRelativePath||f.name).split(/[/\\]/);
    const folder=parts.length>1?parts[parts.length-2]:"Uploaded audio";
    if(!byFolder[folder]) byFolder[folder]=[];
    const url=URL.createObjectURL(f);
    labBlobUrls.push(url);
    byFolder[folder].push({name:f.name, url});
  });
  materials={
    mode:"local",
    exists:true,
    audio:Object.keys(byFolder).sort().map(folder=>{
      const tracks=byFolder[folder].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
      return {folder, tracks, count:tracks.length};
    })
  };
  labFolderIdx=0; labTrackIdx=0;
  renderCurrentModule();
}

function realAudioPickerHtml(prefix){
  if(!totalTracks()){
    return `<div class="lab-toolbar">
      <span class="status-pill warn">${materialsStatus()}</span>
      <button class="btn btn-sm btn-sea" onclick="document.getElementById('pickAudioDir').click()">📁 Pick CD folder(s)</button>
      <button class="btn btn-sm" onclick="document.getElementById('pickAudioFiles').click()">🎵 Pick MP3s</button>
    </div>
    <p style="font-size:.85rem;color:var(--muted)">Best: run <code>python learning/serve-dutch-b1.py</code> then open this page at <code>http://127.0.0.1:8765/dutch-b1-learn.html</code>. Or pick <em>tekstboek 2 CD1</em> etc. from OneDrive.</p>`;
  }
  const folder=materials.audio[labFolderIdx]||materials.audio[0];
  const track=(folder.tracks[labTrackIdx]||folder.tracks[0]);
  let html=`<div class="lab-toolbar">
      <span class="status-pill ok">${materialsStatus()}</span>
      <button class="btn btn-sm" onclick="document.getElementById('pickAudioDir').click()">📁 Other folder</button>
    </div>
    <div class="lab-toolbar" id="${prefix}_folders">`;
  materials.audio.forEach((a,i)=>{
    html+=`<button class="folder-chip ${i===labFolderIdx?"active":""}" onclick="selectLabFolder(${i},'${prefix}')">${esc(a.folder)} (${a.count})</button>`;
  });
  html+=`</div>
    <select id="${prefix}_sel" style="width:100%;padding:.45rem .6rem;border:1px solid var(--line);border-radius:10px;background:#fff" onchange="selectLabTrack(this.selectedIndex,'${prefix}')">`;
  folder.tracks.forEach((t,i)=>{
    html+=`<option ${i===labTrackIdx?"selected":""}>${esc(t.name)}</option>`;
  });
  html+=`</select>
    <audio id="${prefix}_player" class="real-audio" controls preload="metadata" src="${esc(track.url)}"></audio>`;
  return html;
}

function wireRealAudioPicker(prefix){
  wireFilePickers();
  if(prefix==="lab") loadLabTranscript();
}

function selectLabFolder(i, prefix){
  labFolderIdx=i;
  labTrackIdx=0;
  if(currentMod==="lab") renderLab();
  else if(currentMod==="listening") renderListening();
  else if(currentMod==="test") renderTest();
}

function selectLabTrack(i, prefix){
  labTrackIdx=i;
  const folder=materials.audio[labFolderIdx];
  if(!folder) return;
  const track=folder.tracks[i];
  const player=document.getElementById(prefix+"_player");
  if(player && track){
    player.src=track.url;
    player.play().catch(()=>{});
  }
  if(prefix==="lab") loadLabTranscript();
}

function currentLabTrack(){
  const folder=materials.audio[labFolderIdx];
  if(!folder) return null;
  return {folder:folder.folder, track:folder.tracks[labTrackIdx]};
}

async function loadLabTranscript(){
  const box=document.getElementById("labScript");
  if(!box) return;
  const cur=currentLabTrack();
  if(!cur){ box.innerHTML=""; return; }
  if(materials.mode!=="server"){
    box.innerHTML=`<p style="font-size:.88rem;color:var(--muted)">AI transcript needs the local server. Audio still plays. Open via <code>python learning/serve-dutch-b1.py</code> for Dutch + English script.</p>`;
    return;
  }
  box.innerHTML=`<p style="font-size:.88rem;color:var(--muted)">Transcribing ${esc(cur.track.name)}…</p>`;
  try{
    const url="/api/transcript?folder="+encodeURIComponent(cur.folder)+"&track="+encodeURIComponent(cur.track.name);
    const r=await fetch(url);
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"transcript failed");
    let html=`<h4 style="margin:.4rem 0 .55rem">${esc(data.title||cur.track.name)}</h4>`;
    (data.sentences||[]).forEach(s=>{
      html+=`<div class="script-line">${esc(s.nl)}<div class="script-en">${esc(s.en||"")}</div></div>`;
    });
    if(!(data.sentences||[]).length) html+=`<p style="color:var(--muted)">No sentences returned.</p>`;
    box.innerHTML=html;
  }catch(e){
    box.innerHTML=`<p style="font-size:.88rem;color:var(--red)">Transcript failed: ${esc(e.message||e)}. Audio still works.</p>`;
  }
}

// 30-MIN CHAPTER TEST
// ════════════════════════════════════════════════════════════════════
function testSecondsLeft(){
  if(!testRun.active) return 30*60;
  return Math.max(0, Math.round((testRun.endsAt-Date.now())/1000));
}

function formatClock(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function stopTestTimer(){
  if(testTimerId){ clearInterval(testTimerId); testTimerId=null; }
}

function startChapterTest(){
  const ch=currentChapter();
  stopTestTimer();
  testRun.active=true;
  testRun.chId=ch.id;
  testRun.endsAt=Date.now()+30*60*1000;
  testRun.answers={};
  testRun.notes="";
  testRun.realNotes="";
  testRun.finished=false;
  renderTest();
  testTimerId=setInterval(()=>{
    if(!testRun.active) return;
    const left=testSecondsLeft();
    const clock=document.getElementById("testClock");
    const bar=document.getElementById("testTimerBar");
    if(clock) clock.textContent=formatClock(left);
    if(bar) bar.classList.toggle("low", left<=120);
    if(left<=0){
      testRun.active=false;
      stopTestTimer();
      finishChapterTest(true);
    }
  },250);
}

function finishChapterTest(timedOut){
  testRun.active=false;
  stopTestTimer();
  testRun.finished=true;
  testRun.timedOut=!!timedOut;
  const ch=currentChapter();
  const T=TESTS[ch.id];
  let score=0;
  T.listenQs.forEach((q,i)=>{
    if(testRun.answers[i]===q.answer) score++;
  });
  testRun.score=score;
  testRun.max=T.listenQs.length;
  renderTest();
}

function renderTest(){
  const ch=currentChapter();
  const T=TESTS[ch.id];
  if(!T){ document.getElementById("testContent").innerHTML="<p>No test for this chapter.</p>"; return; }

  if(testRun.chId && testRun.chId!==ch.id && (testRun.active||testRun.finished)){
    // switching chapter resets a finished run visually; running test stays bound to its chapter
  }

  if(!testRun.active && !testRun.finished){
    document.getElementById("testContent").innerHTML=`<div class="card">
      <h3 style="font-size:1.15rem;margin-bottom:.4rem">30-min test · H${ch.id} ${esc(ch.title)}</h3>
      <p style="margin-bottom:.7rem;color:var(--muted)">Listening + speaking only. Timer starts when you press start and cannot be paused. Suggested split: 12 min dialogue questions, 8 min real CD, 10 min speaking.</p>
      <ol style="margin:0 0 1rem 1.1rem;color:var(--ink)">
        <li><strong>Luisteren</strong> — play the chapter dialogue (text hidden), then 4 multiple-choice questions.</li>
        <li><strong>CD-sample</strong> — pick any real Contact! 2 track and note what you heard.</li>
        <li><strong>Spreken</strong> — two timed monologues; record yourself.</li>
      </ol>
      <button class="btn btn-primary" onclick="startChapterTest()">Start 30-min test</button>
    </div>`;
    return;
  }

  const left=testSecondsLeft();
  const L=ch.listening;
  let html=`<div class="timer-bar ${left<=120?"low":""}" id="testTimerBar">
      <div>
        <div style="font-size:.75rem;opacity:.8;text-transform:uppercase;letter-spacing:.06em">H${ch.id} · 30-min test</div>
        <div class="timer-clock" id="testClock">${formatClock(left)}</div>
      </div>
      <div class="btn-row">
        ${testRun.finished?"":`<button class="btn btn-sm" style="background:#fff" onclick="finishChapterTest(false)">Finish now</button>`}
        <button class="btn btn-sm" style="background:#fff" onclick="if(confirm('Reset this test?')){stopTestTimer();testRun.active=false;testRun.finished=false;renderTest();}">Reset</button>
      </div>
    </div>`;

  if(testRun.finished){
    html+=`<div class="card">
      <h3>Result</h3>
      <p style="margin:.4rem 0 0">Listening score: <strong>${testRun.score} / ${testRun.max}</strong>${testRun.timedOut?" · time was up":""}.</p>
      <p style="font-size:.88rem;color:var(--muted);margin-top:.35rem">Speaking is not auto-scored — replay your recordings in part 3.</p>
    </div>`;
  }

  html+=`<div class="card">
    <div class="test-part" style="border:0;padding-top:0;margin-top:0">
      <h4>1. Luisteren — ${esc(L.title)}</h4>
      <p style="font-size:.88rem;color:var(--muted);margin-bottom:.55rem">Play twice if you want. Text stays hidden during the test.</p>
      <div class="btn-row" style="margin-bottom:.75rem">
        <button class="btn btn-sm btn-sea" onclick="speakQueue(${esc(JSON.stringify(L.sents.map(s=>s.nl)))},0.9)">▶ Play dialogue</button>
        <button class="btn btn-sm" data-tts-toggle onclick="togglePauseContinue()">■ Stop</button>
      </div>`;
  T.listenQs.forEach((q,i)=>{
    html+=`<div class="qcard" id="tq_${i}"><strong>${i+1}. ${esc(q.q)}</strong>`;
    q.options.forEach((opt,oi)=>{
      const chosen=testRun.answers[i]===oi;
      let cls="option-btn";
      if(testRun.finished){
        if(oi===q.answer) cls+=" correct";
        else if(chosen) cls+=" wrong";
      } else if(chosen) cls+=" correct";
      html+=`<button class="${cls}" ${testRun.finished?"disabled":""} onclick="pickTestAnswer(${i},${oi})">${esc(opt)}</button>`;
    });
    if(testRun.finished) html+=`<div class="answer" style="display:block;margin-top:.35rem">Antwoord: ${esc(q.options[q.answer])}</div>`;
    html+=`</div>`;
  });
  html+=`</div>
    <div class="test-part">
      <h4>2. Real CD sample</h4>
      <p style="font-size:.88rem;color:var(--muted);margin-bottom:.55rem">Pick any track. Listen once or twice. Write 3 words or a short summary — this part is practice, not scored.</p>
      ${realAudioPickerHtml("testPick")}
      <textarea class="note-area" id="testRealNotes" placeholder="Wat hoorde je? 3 woorden / korte samenvatting…" oninput="testRun.realNotes=this.value">${esc(testRun.realNotes)}</textarea>
    </div>
    <div class="test-part">
      <h4>3. Spreken</h4>`;
  T.speaking.forEach((p,idx)=>{
    const rid="t"+idx;
    html+=`<div style="margin-bottom:1rem">
      <div class="speak-prompt-box">
        <strong>${esc(p.title)}</strong> · ${esc(p.type)}
        <div>${esc(p.prompt)}</div>
        <div class="speak-prompt-en">${esc(p.promptEn)}</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-sm btn-sea" id="recBtn_${rid}" onclick="toggleRec('${rid}')">🎤 Record (${p.seconds||90}s)</button>
        <button class="btn btn-sm" id="playRecBtn_${rid}" onclick="playRecording('${rid}')" disabled>▶ Listen recording</button>
        ${testRun.finished?`<button class="btn btn-sm" onclick="speak(${esc(JSON.stringify(p.sampleNl))},0.9)">▶ Sample</button>`:""}
      </div>
      <div class="rec-result" id="recResult_${rid}">Record your answer in Dutch.</div>
      <audio id="recAudio_${rid}" class="rec-audio" controls></audio>
    </div>`;
  });
  html+=`</div></div>`;

  document.getElementById("testContent").innerHTML=html;
  wireRealAudioPicker("testPick");

  window.pickTestAnswer=function(qi, oi){
    if(!testRun.active || testRun.finished) return;
    testRun.answers[qi]=oi;
    const card=document.getElementById("tq_"+qi);
    if(!card) return;
    card.querySelectorAll(".option-btn").forEach((btn,idx)=>{
      btn.classList.toggle("correct", idx===oi);
    });
  };
}

// ════════════════════════════════════════════════════════════════════
// WRITING
// ════════════════════════════════════════════════════════════════════
function renderWriting(){
  const ch=currentChapter();
  const w=ch.writing;
  const storageKey=`write_${ch.id}`;
  const saved=localStorage.getItem(storageKey)||"";
  let html=`<div class="card">
    <h3 style="font-size:1.1rem;margin-bottom:.65rem">Schrijfopdracht</h3>
    <div class="writing-prompt">${w.prompt}</div>
    <div class="writing-tip">💡 Tip: ${w.tip}</div>
    <div style="margin:.55rem 0 .3rem;font-size:.83rem;font-weight:700;color:var(--muted)">Handige zinnen — klik om te horen:</div>
    <div class="useful-phrases" style="margin-bottom:.75rem">`;
  w.phrases.forEach(ph=>{
    html+=`<span class="phrase-chip" onclick="speak(${JSON.stringify(ph)},0.88)">${ph}</span>`;
  });
  html+=`</div>
    <textarea class="writing-area" id="writeArea" placeholder="Schrijf hier je tekst…" oninput="updateWordCount('${storageKey}','${w.minWords}')">${saved}</textarea>
    <div class="word-count" id="wordCount">0 woorden (minimum: ${w.minWords})</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="saveWriting('${storageKey}')">Opslaan</button>
      <button class="btn" onclick="speak(document.getElementById('writeArea').value, 0.92)">▶ Lees voor</button>
      <button class="btn" data-tts-toggle onclick="togglePauseContinue()">■ Stop</button>
      <button class="btn" onclick="if(confirm('Wis je tekst?')){document.getElementById('writeArea').value='';updateWordCount('${storageKey}','${w.minWords}')}">Wissen</button>
      <span class="saved-indicator" id="savedInd">Opgeslagen ✓</span>
    </div>
  </div>`;
  document.getElementById("writingContent").innerHTML=html;
  updateWordCount(storageKey, w.minWords);

  window.updateWordCount=function(key, min){
    const txt=document.getElementById("writeArea").value;
    const wc=txt.trim()?txt.trim().split(/\s+/).length:0;
    const el=document.getElementById("wordCount");
    el.textContent=wc+" woorden (minimum: "+min+")";
    el.className="word-count"+(wc>=min?" ok":"");
    localStorage.setItem(key, txt);
  };
  window.saveWriting=function(key){
    const txt=document.getElementById("writeArea").value;
    localStorage.setItem(key, txt);
    const ind=document.getElementById("savedInd");
    ind.classList.add("show");
    setTimeout(()=>ind.classList.remove("show"),1800);
  };
}
